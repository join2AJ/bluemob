      </div>
      <div class="section-h"><h2 class="t-head">Play together</h2><button class="btn text" data-act="play">All 12 games</button></div>
      <div class="hscroll">
        <button class="gcard press" style="background:linear-gradient(150deg, var(--pine), #0B3D2E)" data-act="lobby" data-v="ttt"><span class="em">⭕</span><b>Tic-tac-toe</b><span style="font-size:13px;opacity:.85">Ask people nearby</span></button>
        <button class="gcard press" style="background:linear-gradient(150deg, #C2621A, #7A3A0E)" data-act="lobby" data-v="c4"><span class="em">🔴</span><b>Connect 4</b><span style="font-size:13px;opacity:.85">Ask people nearby</span></button>
        <button class="gcard press" style="background:linear-gradient(150deg, #2F7BC0, #173E5C)" data-act="play"><span class="em">🎲</span><b>All games</b><span style="font-size:13px;opacity:.85">Quiz, word chain, treasure hunt and more</span></button>
      </div>
      <p class="t-cap" style="text-align:center;margin-top:24px">Web preview · nearby people are simulated. The Android app finds real phones over Bluetooth and Wi-Fi.</p>`;
  }
  function personCard(p) {
    const label = { online: "ONLINE", range: "IN RANGE", offline: "AWAY" }[p.presence];
    const sub = p.presence === "online" ? (S.shareLoc ? fmtDist(p.dist) + " · " : "") + p.link
      : p.presence === "range" ? "Connecting…" : "Seen " + ago(p.lastSeen);
    return `<button class="pcard press" data-act="open-chat" data-id="${p.id}">
      <span class="art" style="background:${tint(p.id)}"><span class="tag"><span class="dot" style="background:${p.sos ? "var(--rose)" : PCOLOR[p.presence]}"></span>${p.sos ? "SOS" : label}</span>${p.avatar}</span>
      <span class="body"><span class="t-strong ellipsis">${nameWithId(p)}</span><span class="t-cap ellipsis" data-status-card="${p.id}">${sub}</span></span></button>`;
  }
  function updatePeopleText() {
    document.querySelectorAll("[data-status-card]").forEach((el) => {
      const p = P[el.dataset.statusCard];
      if (p.presence === "online") el.textContent = (S.shareLoc ? fmtDist(p.dist) + " · " : "") + p.link;
    });
  }

  // Placement: with location, real bearing on a log scale (rings at 10 m, ~300 m, 10 km);
  // without, a stable direction and a ring that reflects how reachable they are.
  function blipPos(p) {
    const r = S.shareLoc
      ? Math.min(.9, Math.max(.14, (Math.log10(Math.max(1, p.dist)) + .5) / 4.5))
      : { online: .36, range: .6, offline: .84 }[p.presence];
    const a = (p.bearing * Math.PI) / 180;
    return { x: 50 + 50 * r * Math.sin(a), y: 50 - 50 * r * Math.cos(a) };
  }
  function placeBlips() {
    document.querySelectorAll("[data-blip]").forEach((el) => {
      const p = P[el.dataset.blip];
      const { x, y } = blipPos(p);
      el.style.left = x + "%"; el.style.top = y + "%";
    });
  }

  // The radar is always drawn on a night sky, in both themes.
  const STARS = Array.from({ length: 46 }, () => [Math.random(), Math.random(), Math.random() * 1.2 + .3, Math.random()]);
  let sweep = 0;
  function drawRadars() {
    document.querySelectorAll(".radar-wrap canvas").forEach((cv) => {
      const box = cv.getBoundingClientRect();
      if (!box.width) return;
      const dpr = window.devicePixelRatio || 1;
      const W = Math.round(box.width * dpr);
      if (cv.width !== W) { cv.width = W; cv.height = W; }
      const ctx = cv.getContext("2d");
      const c = W / 2, r = c * .92;
      ctx.clearRect(0, 0, W, W);
      STARS.forEach(([x, y, s, tw]) => {
        ctx.fillStyle = `rgba(234,245,240,${.15 + .35 * Math.abs(Math.sin(sweep / 40 + tw * 6))})`;
        ctx.beginPath(); ctx.arc(x * W, y * W, s * dpr, 0, Math.PI * 2); ctx.fill();
      });
      ctx.strokeStyle = "rgba(234,245,240,.10)"; ctx.lineWidth = dpr;
      for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(c, c, (r * i) / 3, 0, Math.PI * 2); ctx.stroke(); }
      ctx.setLineDash([2 * dpr, 6 * dpr]);
      ctx.beginPath(); ctx.moveTo(c - r, c); ctx.lineTo(c + r, c); ctx.moveTo(c, c - r); ctx.lineTo(c, c + r); ctx.stroke();
      ctx.setLineDash([]);
      const demo = cv.parentElement.dataset.demo;
      if ((S.mesh || demo) && ctx.createConicGradient) {
        const a = (sweep * Math.PI) / 180;
        const g = ctx.createConicGradient(a, c, c);
        g.addColorStop(0, "rgba(95,211,163,.55)"); g.addColorStop(.18, "rgba(95,211,163,0)"); g.addColorStop(1, "rgba(95,211,163,0)");
        ctx.save(); ctx.scale(1, 1);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(95,211,163,.8)"; ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(c + r * Math.cos(a), c + r * Math.sin(a)); ctx.stroke();
        ctx.restore();
      }
      if (demo) {
        [[40, .35, "#3FC897"], [150, .62, "#3FC897"], [250, .84, "#E9A23B"]].forEach(([b, rr, col]) => {
          const ang = (b * Math.PI) / 180, x = c + r * rr * Math.sin(ang), y = c - r * rr * Math.cos(ang);
          ctx.fillStyle = col; ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(x, y, 14 * dpr, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, 7 * dpr, 0, Math.PI * 2); ctx.fill();
        });
      }
      const pulse = .5 + .5 * Math.abs(Math.sin(sweep / 25));
      ctx.fillStyle = "rgba(125,183,234,.28)"; ctx.beginPath(); ctx.arc(c, c, (10 + 12 * pulse) * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7DB7EA"; ctx.beginPath(); ctx.arc(c, c, 6.5 * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * dpr; ctx.stroke();
    });
    if (!reduceMotion && !S.survival) sweep = (sweep + 1.6) % 360;
    requestAnimationFrame(drawRadars);
  }

  // ---------- Chats ----------
  function chatEntries() {
    const entries = [
      { id: "sky", name: SKY.name, emoji: SKY.avatar, presence: "online", kind: "bot", status: "Your practice buddy" },
      ...["dee", "experts", ...S.contacts.map((c) => c.id)].map((id) => ({ id, name: P[id].name, emoji: P[id].avatar, presence: "remote",
        kind: P[id].sms ? "sms" : id === "experts" ? "expert" : "far", status: statusLine(P[id]) })),
      ...nearby().map((p) => ({ id: p.id, name: p.name, emoji: p.avatar, presence: p.presence, kind: p.presence === "offline" ? "far" : "near", status: statusLine(p) })),
    ];
    const lastTime = (e) => S.convos[e.id]?.messages.at(-1)?.time ?? 0;
    return entries.sort((a, b) => (a.id === "sky" ? -1 : b.id === "sky" ? 1 : 0) || lastTime(b) - lastTime(a) || ORDER[a.presence] - ORDER[b.presence]);

  function chatsView() {

        <div class="stories">${onlineNow.map((p) => `<button class="story press" data-act="open-chat" data-id="${p.id}">${avatar(p.avatar, p.id, 60, "online")}<span class="ellipsis" style="max-width:64px">${esc(p.name)}</span></button>`).join("")}</div>` : ""}
      <div class="filters" role="group" aria-label="Filter chats">${[["all", "All"], ["unread", "Unread"], ["online", "Online"], ["nearby", "Nearby"], ["far", "Far away"]].map(([v, l]) =>

      <span class="main"><span class="line1"><span class="name ellipsis">${P[e.id] ? nameWithId(P[e.id]) : esc(e.name)}</span>${tag}</span>
        <span class="preview ellipsis">${preview}</span></span>
      <span class="side">${last ? `<span class="time num">${stamp(last.time)}</span>` : ""}${unread ? `<span class="count">${unread}</span>` : ""}</span></button>`;
  }

  // ---------- Chat ----------
  function chatInfo(id) {
    if (id === "sky") return { name: SKY.name, emoji: SKY.avatar, presence: "online", bot: true };
    const p = P[id];
    return { name: p.name, emoji: p.avatar, presence: p.presence, remote: p.remote, far: p.remote || p.presence === "offline", sms: p.sms };
  }
  // You can always write: people out of range are reached through the internet once a bridge is nearby.
  function canSend(id) { return true; }
  function chatView(anim) {
    const id = S.chat, info = chatInfo(id);
    const live = !info.bot && !info.far;
    return `<div class="screen chat-screen ${anim === "push" ? "push-in" : ""}">
      <header class="bar solid chat-bar">
        <button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button>

        ${live ? `<button class="icon-btn" data-act="ping" id="ping-btn" aria-label="Check link speed">${I.speed}</button>` : ""}
        <button class="icon-btn" data-act="soon" data-v="Voice calls" aria-label="Voice call">${I.phone}</button>

      </header>

      <div class="messages ${info.bot ? "" : "with-strip"}" id="messages"></div>
      <div class="suggest" id="chips"></div>
      <div class="composer-wrap">
        <div class="composer-note" id="note" hidden></div>
        <form class="composer" id="composer">
          <div class="field-pill">
            <button type="button" class="icon-btn" data-act="soon" data-v="Emoji" aria-label="Emoji">${I.smile}</button>
            <input id="draft" autocomplete="off" placeholder="Message" aria-label="Message">
            <button type="button" class="icon-btn" data-act="soon" data-v="Photos and files" aria-label="Attach">${I.plus}</button>

  }
  function introHtml(id, info) {
    const p = P[id];
    const sub = info.bot ? "Built into BlueMob, on your phone. No internet, no server: what you ask stays here. I know the app, the survival guide, and what's happening around you."
      : id === "experts" ? "Volunteer medics, rangers and rescuers. Your questions go out as soon as someone nearby has internet, and you're notified when they reply."
      : info.sms ? `${esc(p.phone)} · They don't need BlueMob. Your message reaches them as a normal text once someone nearby has internet.`
      : info.remote ? "2,000 km away. Messages travel through a nearby friend who has internet."
      : p.presence === "offline" ? `You met on the trip. ${p.home ? "Now in " + esc(p.home) + ". " : ""}You can still talk, by BlueMob ID, with no phone numbers shared.`
      : "Met nearby over " + (p.link || "Bluetooth") + ". Messages go phone to phone.";
    const tag = info.bot ? '<span class="tag sky">ON THIS PHONE · OFFLINE</span>' : info.sms ? '<span class="tag ember">BY TEXT MESSAGE</span>'
      : info.far ? '<span class="tag ember">VIA BRIDGE</span>' : '<span class="tag pine">DIRECT</span>';
    return `<div class="intro">${avatar(info.emoji, id, 80)}<h2 class="t-title" style="margin-top:8px">${esc(info.name)}</h2>${tag}<p class="t-sub" style="margin-top:4px">${sub}</p></div>`;
  }
  function journeyHtml(m) {
    const pn = pendingNote(m);
    if (m.status === "pending" || !m.route || m.route.length < 3) return pn ? `<div class="journey-note">${pn}</div>` : "";
    const done = m.status === "delivered";
    const steps = m.route.map((h, i) => `<li class="${done || i < m.hop ? "done" : i === m.hop ? "now" : ""}"><i></i><span class="ellipsis" style="max-width:100%">${esc(h.replace(" 🌐", ""))}</span></li>`).join("");
    const note = done ? "Delivered through Meera's internet · tap for details" : m.hop === 0 ? "Leaving your phone…" : "Passing through " + m.route[m.hop].replace(" 🌐", "") + "…";
    return `<ol class="journey" aria-label="Route">${steps}</ol><div class="journey-note">${note}</div>`;
  }
  function messagesHtml(id, info, c) {
    const out = [introHtml(id, info), '<span class="tag day">TODAY</span>'];
    const ms = c.messages;
    const same = (a, b) => a && b && a.me === b.me && Math.abs(b.time - a.time) < 120e3 && !a.route && !b.route && a.status !== "queued" && b.status !== "queued";
    ms.forEach((m, i) => {
      const withPrev = same(ms[i - 1], m), withNext = same(m, ms[i + 1]);
      const pos = withPrev && withNext ? "mid" : withNext ? "first" : withPrev ? "last" : "";
      const isNew = !S.seen.has(m.id);
      S.seen.add(m.id);
      const showMeta = !withNext || m.route || m.status === "failed";
      const tick = m.me && m.status === "local" ? '<span class="t-cap">on this phone</span>' : m.me ? (m.status === "failed" ? '<span class="fail">Not sent · out of range</span>'
        : `<span class="${m.status === "delivered" || m.status === "read" ? "ok" : ""}" style="display:inline-flex">${TICK[m.status] || ""}</span>`) : "";
      const tap = m.me && m.status !== "local";
      out.push(`<div class="msg ${m.me ? "me" : "them"} ${tap ? "tappable" : ""} ${m.route && m.route.length > 2 ? "routed" : ""} ${pos} ${withPrev ? "" : "gap"} ${isNew ? "new" : ""}" data-mid="${m.id}" ${tap ? `data-act="msg-info" data-v="${m.id}"` : ""}>
        <div class="bubble">${esc(m.text)}</div>${m.me ? journeyHtml(m) : ""}
        ${m.actions ? `<div class="bot-actions">${m.actions.map((a) => `<button class="chip" data-act="${a.act}" data-v="${a.v || ""}">${esc(a.label)}</button>`).join("")}</div>` : ""}
        ${showMeta ? `<div class="meta">${clock(m.time)}${tick}</div>` : ""}</div>`);
    });
    if (c.typing) out.push('<div class="typing" aria-label="typing"><i></i><i></i><i></i></div>');
    return out.join("");
  }
  function renderChatParts(first) {
    const id = S.chat, info = chatInfo(id), c = convo(id);
    c.unread = 0;
    const sub = document.getElementById("chat-sub");
    if (!sub) return;
    if (first) S.convos[id].messages.forEach((m) => S.seen.add(m.id));
    sub.innerHTML = c.typing ? '<span class="typing-text">typing…</span>'
      : info.bot ? "Lives on your phone · works offline"
      : info.far ? statusLine(P[id])
      : info.presence === "online" ? '<span style="color:var(--pine)">Online nearby</span>'
      : info.presence === "range" ? "In range · connecting…" : "Seen " + ago(P[id].lastSeen);
    const av = document.getElementById("chat-av");
    if (av) av.innerHTML = avatar(info.emoji, id, 38, info.presence);
    const ping = document.getElementById("ping-btn");
    if (ping) ping.hidden = info.presence !== "online";

    const strip = document.getElementById("route-strip");
    if (strip) {
      const lastMine = c.messages.filter((m) => m.me).at(-1);
      const route = lastMine && lastMine.route;
      strip.innerHTML = lastMine
        ? `<span>Last message: <b>${route ? route.map(esc).join(" → ") : "You → " + esc(info.name)}</b> · ${lastMine.status === "read" ? "read " + clock(lastMine.receipts.at(-1).time) : lastMine.status === "delivered" ? "delivered " + clock(lastMine.receipts[0].time) : lastMine.status === "pending" ? "waiting: in range or bridge, whichever comes first" : "on its way"}</span><span class="chev">${I.chevron}</span>`
        : `<span><b>${esc(S.name)} ${shortId(MY_ID)}</b> → <b>${esc(info.name)} ${P[id].sms ? esc(P[id].phone) : shortId(P[id].uid)}</b> · ${info.far ? "through a bridge to the internet" : "direct, phone to phone"}</span>`;
      strip.dataset.v = lastMine ? lastMine.id : "";
    }
    const box = document.getElementById("messages");
    const nearBottom = first || box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = messagesHtml(id, info, c);
    if (nearBottom) box.scrollTo({ top: box.scrollHeight, behavior: first ? "auto" : "smooth" });

    document.getElementById("chips").innerHTML = info.bot && !c.typing
      ? SKY_CHIPS.map((s) => `<button class="chip" data-act="suggest" data-v="${esc(s)}">${esc(s)}</button>`).join("") : "";
    const ok = canSend(id);
    const note = document.getElementById("note");
    const noteText = info.far && !bridgeOnline() ? "No one nearby has internet yet. Your message waits safely and goes out the moment a bridge appears." : "";
    note.textContent = noteText; note.hidden = !noteText;
    const draft = document.getElementById("draft");
    draft.disabled = !ok;
    draft.placeholder = ok ? "Message" : "Out of range";
    syncSend();
  }
  function syncSend() {
    const draft = document.getElementById("draft"), btn = document.getElementById("send-btn");
    if (!draft || !btn) return;
    const has = !!draft.value.trim();
    btn.classList.toggle("mic", !has);
    btn.innerHTML = has ? I.send : I.mic;
    btn.setAttribute("aria-label", has ? "Send" : "Record voice note");
    btn.disabled = draft.disabled;
  }

    switch (act) {
      case "next": S.slide++; render(); break;
      case "skip": S.slide = SLIDES.length; render(); break;

      case "pick-avatar":
        S.avatar = v; store.set("avatar", v);

          document.getElementById("ob-avatar").textContent = v;
          document.querySelectorAll('[data-act="pick-avatar"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v));

        S.shareLoc = !S.shareLoc; store.set("shareLoc", S.shareLoc);

    const minY = Math.min(...pts.map((p) => p.y)) - 60, maxY = Math.max(...pts.map((p) => p.y)) + 60;
    const W = 340, H = 220, s = Math.min(W / (maxX - minX), H / (maxY - minY));
    const ox = (W - (maxX - minX) * s) / 2, oy = (H - (maxY - minY) * s) / 2;
    const X = (x) => ox + (x - minX) * s, Y = (y) => H - (oy + (y - minY) * s);

    const scaleM = 200, scalePx = scaleM * s;

        <text x="${X(t.x)}" y="${Y(t.y) + 5}" text-anchor="middle" font-size="${t.id === target.id ? 15 : 12}">${t.emoji}</text></g>`).join("")}
      <g transform="translate(${X(m.x)} ${Y(m.y)}) rotate(${S.heading})"><path d="M0 -20 L9 2 L-9 2 Z" fill="var(--sky)" opacity=".35"/></g>
      <circle cx="${X(m.x)}" cy="${Y(m.y)}" r="7" fill="var(--sky)" stroke="var(--canvas)" stroke-width="2.5"/>
      <text x="${W - 12}" y="20" text-anchor="end" font-size="12" font-weight="800" fill="var(--rose)">N ↑</text>
      <line x1="12" y1="${H - 14}" x2="${12 + scalePx}" y2="${H - 14}" stroke="var(--ink-2)" stroke-width="2"/>

  function beep(ms) {
    try {

      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 2800; // close to a rescue whistle
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms / 1000);

  function sosPattern() {
    const dot = 300, pattern = [];
    const sym = (on) => { pattern.push([true, on]); pattern.push([false, dot]); };
    [1, 1, 1].forEach(() => sym(dot)); pattern[pattern.length - 1][1] = dot * 3;
    [1, 1, 1].forEach(() => sym(dot * 3)); pattern[pattern.length - 1][1] = dot * 3;
    [1, 1, 1].forEach(() => sym(dot)); pattern[pattern.length - 1][1] = dot * 7;
    return pattern;
  }
  function startSos() {

    let i = 0;
    const step = () => {
      const el = app.querySelector(".sos-screen");
      if (!el) return;
      const [on, ms] = pattern[i % pattern.length];
      el.classList.toggle("flash", on && screen);

  // Tic-tac-toe with someone nearby. Each move is a tiny message over the mesh.
  const G = { board: Array(9).fill(""), turn: "x", over: null, line: null, you: 0, them: 0, opp: "asha", last: -1 };
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const winner = (b) => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return { who: b[l[0]], line: l }; return b.every(Boolean) ? { who: "draw", line: [] } : null; };
  function aiMove(b) {
    const free = b.map((v, i) => (v ? null : i)).filter((i) => i !== null);
    const tryWin = (mark) => free.find((i) => { const c = b.slice(); c[i] = mark; return winner(c)?.who === mark; });
    let m = tryWin("o"); if (m !== undefined) return m;
    m = tryWin("x"); if (m !== undefined && Math.random() < .85) return m;
    if (!b[4]) return 4;
    const corners = [0, 2, 6, 8].filter((i) => !b[i]);
    return corners.length && Math.random() < .7 ? corners[Math.floor(Math.random() * corners.length)] : free[Math.floor(Math.random() * free.length)];
  }
  function finishCheck() {
    const w = winner(G.board);
    if (!w) return false;
    G.over = w.who; G.line = w.line;
    if (w.who === "x") G.you++; else if (w.who === "o") G.them++;
    return true;
  }

  };
  const URGENT = /\b(hurt|pain|sick|injur|emergency|bitten|stung|sting|allerg|fever|poison|vomit|faint|seizure|pregnan|unwell|dizzy|bee|scorpion|spider)/;
  function skyReply(text) {
    const t = text.toLowerCase();
    S.lastQ = text;
    // Questions about the app itself, and live insights from this phone, come first.
    const appAnswer = skyAppAnswer(t);
    if (appAnswer) return appAnswer;
    let best = null, score = 0;
    for (const [id, keys] of Object.entries(SKY_KEYS)) {
      const sc = keys.reduce((n, k) => n + (t.includes(k) ? k.length : 0), 0);
      if (sc > score) { score = sc; best = id; }
    }
    if (best) {
      const a = ARTICLES.find((x) => x.id === best);
      const steps = a.steps.slice(0, 4).map((s, i) => `${i + 1}. ${s}`).join("\n");
      const more = a.steps.length > 4 ? `\n…plus ${a.steps.length - 4} more step${a.steps.length - 4 > 1 ? "s" : ""} in the guide.` : "";
      const avoid = a.donts.length ? `\n\nAvoid: ${a.donts.join(" ")}` : "";
      const actions = [{ label: "Open full guide", act: "open-article", v: a.id }];
      if (a.cat === "aid") actions.push({ label: "🆘 SOS", act: "sos" });
      actions.push({ label: "Ask an expert", act: "ask-expert" });
      return { text: `From your survival guide: ${a.title}\n${a.intro}\n\n${steps}${more}${avoid}`, actions };
    }
    const unknownHelp = {
      text: "I don't have a guide for that on your phone. Here's what I can do:\n\n" +
        "• Ask an expert: I'll send your question to volunteer medics and rangers as soon as someone nearby has internet (a bridge). You'll be notified when they reply.\n" +
        "• SOS: reaches everyone nearby right away, and texts your SOS contacts as soon as a bridge appears.\n" +
        "• Message your loved ones: it goes out the moment a bridge is available.",
      actions: [{ label: "Ask an expert", act: "ask-expert" }, { label: "🆘 SOS", act: "sos" }, { label: "Message loved ones", act: "contacts" }, { label: "Browse the guide", act: "tab-guide" }],
    };
    if (URGENT.test(t)) return unknownHelp;
    if (SKY_RULES.some(([keys]) => keys.some((k) => matches(t, k)))) return pickReply(SKY_RULES, SKY_FALLBACK, text);
    if (/\?|\b(how|what|why|where|when|can i|should i|is it)\b/.test(t)) return unknownHelp;
    return pickReply(SKY_RULES, SKY_FALLBACK, text);
  }

  // ---------- trip money: who owes whom, settled later through UPI ----------
  const RUPEE = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
  S.ledger = store.get("ledger", [
    { id: "e1", payer: "asha", amount: 900, note: "Dinner at the dhaba", split: ["me", "asha", "ravi"], time: now() - 5 * 3600e3, example: true },
    { id: "e2", payer: "me", amount: 600, note: "Fuel", split: ["me", "ravi"], time: now() - 3 * 3600e3, example: true },

  const nameOf = (id) => (id === "me" ? "You" : P[id] ? P[id].name : id);
  function balances() {
    const b = {};

      const share = e.amount / e.split.length;
      if (e.payer === "me") e.split.filter((x) => x !== "me").forEach((x) => (b[x] = (b[x] || 0) + share));
      else if (e.split.includes("me")) b[e.payer] = (b[e.payer] || 0) - share;
    }
    for (const [id, v] of Object.entries(S.settled)) if (b[id] != null) b[id] -= v;
    return Object.entries(b).filter(([, v]) => Math.abs(v) >= 1);
  }
  function moneyView() {

          .map(([c, ic, a, b]) => `<div class="set"><span class="tile" style="background:${c}">${ic}</span><span class="main"><span class="t-strong" style="display:block">${a}</span><span class="t-cap">${b}</span></span></div>`).join("")}
      </div>`);
  }

  // ---------- games: catalogue, lobby, invites ----------
  const GAMES = [
    { id: "ttt", name: "Tic-tac-toe", em: "⭕", players: "2 players", play: true, grad: "linear-gradient(150deg,#11694E,#0B3D2E)" },
    { id: "c4", name: "Connect 4", em: "🔴", players: "2 players", play: true, grad: "linear-gradient(150deg,#C2621A,#7A3A0E)" },

  const gameOf = (id) => GAMES.find((g) => g.id === id);
  S.muteInvites = store.get("muteInvites", false);
  S.lobby = null;
  S.invite = null;
  // How simulated nearby people answer an invite.
  function inviteAnswer(pid, game) {
    if (pid === "asha2") return { state: "muted" };

    if (pid === "asha") return ["quiz", "words", "twenty"].includes(game) ? { state: "suggest", suggest: "c4", say: "Not this one. Connect 4?" } : { state: "joined" };
    if (pid === "ravi") return ["quiz", "words", "twenty", "wolf", "chess"].includes(game) ? { state: "joined" } : { state: "suggest", suggest: "quiz", say: "Not this. Survival quiz?" };
    return { state: "joined" };
  }
  function openLobby(game, preJoined) {

      if (p.id === preJoined) return;
      later(900 + i * 700, () => {
        if (!S.lobby || S.lobby.game !== game) return;
        S.lobby.responses[p.id] = inviteAnswer(p.id, game);
        if (S.screen === "lobby") render();
      });
    });
    S.screen === "lobby" ? render() : open("lobby");
  }
  function gamesHubView() {
    return subScreen("Play", `
      <div class="large-title" style="margin-top:8px"><h1 class="t-hero">Play together</h1>
        <p class="t-sub" style="margin-top:6px">Pick a game and BlueMob asks people nearby if they'd like to join. They can say yes, suggest another game, or mute invites.</p></div>
      <div class="games-grid">${GAMES.map((g) => `<button class="game-tile press" data-act="lobby" data-v="${g.id}" style="${g.play ? `background:${g.grad};color:#fff` : ""}">
        <span class="em">${g.em}</span><b>${g.name}</b><span class="t-cap" style="color:inherit;opacity:.8">${g.players}</span>
        ${g.play ? "" : '<span class="tag">ANDROID APP</span>'}</button>`).join("")}</div>
      <div class="group" style="margin-top:20px"><div class="set"><span class="tile" style="background:var(--ink-3)">${I.game}</span>
        <span class="main"><span class="t-strong" style="display:block">Game invites from others</span><span class="t-cap">${S.muteInvites ? "Muted. Nobody can invite you." : "On. You'll see a banner when someone nearby invites you."}</span></span>
        <button class="switch" role="switch" aria-checked="${!S.muteInvites}" aria-label="Game invites" data-act="mute-invites"></button></div></div>
      <button class="btn text" style="margin:12px auto 0;display:flex" data-act="games">Which games work offline, and why?</button>`);
  }
  function lobbyView() {
    const g = gameOf(S.lobby.game);
    const R = S.lobby.responses;
    const ids = Object.keys(R);

    const pill = (r) => ({
      asking: '<span class="tag">ASKING…</span>', joined: '<span class="tag pine">JOINED</span>', busy: '<span class="tag ember">BUSY</span>',
      muted: '<span class="tag">MUTED INVITES</span>', suggest: '<span class="tag sky">SUGGESTS ANOTHER</span>' }[r.state]);
    return subScreen(g.name, `
      <div class="intro" style="padding-top:6px"><span style="font-size:56px">${g.em}</span><h1 class="t-title">${g.name}</h1><span class="t-sub">${g.players}</span></div>
      <div class="group-label t-over">Asked ${ids.length} people nearby</div>
      <div class="group">${ids.length ? ids.map((id) => { const p = P[id], r = R[id]; return `<div class="set">${avatar(p.avatar, id, 40, p.presence)}
          <span class="main"><span class="t-strong" style="display:block">${nameWithId(p)}</span>
          <span class="t-cap">${r.say ? "“" + esc(r.say) + "”" : r.state === "muted" ? "Has game invites turned off" : r.state === "asking" ? "Invite sent over the mesh…" : "Ready to play"}</span></span>
          ${r.state === "suggest" ? `<button class="btn small secondary" data-act="lobby-switch" data-v="${r.suggest}" data-p="${id}">Play ${gameOf(r.suggest).name}</button>` : pill(r)}</div>`; }).join("")
        : '<div class="set"><span class="t-sub">No one online nearby. Switch the mesh on and wait for people to appear.</span></div>'}</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px">
        ${g.play ? `<button class="btn" data-act="lobby-start" ${joined.length ? "" : "disabled"}>${joined.length ? "Start with " + joined.map((id) => esc(P[id].name)).join(", ") : "Waiting for someone to join…"}</button>`
          : '<p class="t-sub" style="text-align:center;max-width:32ch">This game is coming in the Android app. Try one of the coloured games for now.</p>'}
      </div>`);
  }
  function startGame(game, opp) {
    S.lobby = null;
    // Leave the lobby behind, so "back" from the game returns to where the invite started.
    if (S.screen === "lobby") Object.assign(S, S.stack.pop() || { screen: "main" });
    if (game === "ttt") { Object.assign(G, { board: Array(9).fill(""), turn: "x", over: null, line: null, last: -1, opp }); open("ttt"); }
    if (game === "quiz") { Object.assign(Q, { i: 0, you: 0, them: 0, picked: null, theirPick: null, done: false, opp }); open("quiz"); }
    if (game === "c4") { Object.assign(C4, { b: Array(42).fill(""), turn: "x", over: null, line: [], last: -1, opp }); open("c4"); }
    if (game === "words") { Object.assign(W, { words: [], over: null, opp, msg: "" }); open("words"); }
    if (game === "hunt") { huntNew(opp); open("hunt"); }
  }
  // Someone nearby invites you, unless invites are muted.
  function maybeInvite() {
    if (S.muteInvites || S.invite || !S.mesh || P.ravi.presence !== "online" || !S.onboarded) return;
    S.invite = { from: "ravi", game: "quiz", choosing: false };
    refresh();
  }
  function inviteBanner() {
    const iv = S.invite;
    if (!iv || S.screen !== "main") return "";
    const p = P[iv.from], g = gameOf(iv.game);
    return `<div class="invite" role="alert">
      <div class="row" style="padding:0;gap:12px">${avatar(p.avatar, p.id, 40, p.presence)}
        <span class="main"><span class="t-strong" style="display:block">${esc(p.name)} invites you to ${g.em} ${g.name}</span><span class="t-cap">${fmtDist(p.dist)} away · nearby</span></span></div>
      ${iv.choosing ? `<div class="filters" style="margin:10px 0 0;padding:0">${GAMES.filter((x) => x.play && x.id !== iv.game).map((x) =>
          `<button class="chip" data-act="invite-suggest" data-v="${x.id}">${x.em} ${x.name}</button>`).join("")}</div>`
        : `<div class="invite-actions"><button class="btn small" data-act="invite-join">Join</button>
          <button class="btn small secondary" data-act="invite-other">Not this one</button>
          <button class="btn small secondary" data-act="invite-mute">Mute invites</button></div>`}
    </div>`;
  }

  // Connect 4
  const C4 = { b: Array(42).fill(""), turn: "x", over: null, line: [], you: 0, them: 0, opp: "asha", last: -1 };
  const c4At = (b, r, c) => (r < 0 || r > 5 || c < 0 || c > 6 ? null : b[r * 7 + c]);
  function c4Drop(b, col, mark) { for (let r = 5; r >= 0; r--) if (!b[r * 7 + col]) { b[r * 7 + col] = mark; return r * 7 + col; } return -1; }
  function c4Win(b) {
    for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
      const m = b[r * 7 + c]; if (!m) continue;
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const cells = [0, 1, 2, 3].map((k) => [r + dr * k, c + dc * k]);
        if (cells.every(([rr, cc]) => c4At(b, rr, cc) === m)) return { who: m, line: cells.map(([rr, cc]) => rr * 7 + cc) };
      }
    }
    return b.every(Boolean) ? { who: "draw", line: [] } : null;
  }
  function c4Ai(b) {
    const cols = [3, 2, 4, 1, 5, 0, 6].filter((c) => !b[c]);
    for (const mark of ["o", "x"]) for (const c of cols) { const t = b.slice(); c4Drop(t, c, mark); if (c4Win(t)?.who === mark) return c; }
    const safe = cols.filter((c) => { const t = b.slice(); c4Drop(t, c, "o"); return !cols.some((c2) => { const u = t.slice(); return c4Drop(u, c2, "x") >= 0 && c4Win(u)?.who === "x"; }); });
    const pool = safe.length ? safe : cols;
    return Math.random() < .6 ? pool[0] : pool[Math.floor(Math.random() * pool.length)];
  }
  function c4View() {
    const opp = P[C4.opp];
    const status = C4.over ? (C4.over === "x" ? "You win! 🎉" : C4.over === "o" ? opp.name + " wins" : "It's a draw") : C4.turn === "x" ? "Your move: tap a column" : opp.name + " is thinking…";
    return subScreen("Connect 4", `
      ${vsHeader(opp, C4.you, C4.them, "Green", "Orange")}
      <p class="t-head" style="text-align:center;margin:8px 0 14px" aria-live="polite">${status}</p>
      <div class="c4" role="grid" aria-label="Connect 4 board">${C4.b.map((v, i) => `<button class="c4-cell ${v} ${C4.line.includes(i) ? "win" : ""} ${i === C4.last ? "drop" : ""}"
        data-act="c4" data-v="${i % 7}" ${C4.over || C4.turn !== "x" || C4.b[i % 7] ? "disabled" : ""} aria-label="Column ${(i % 7) + 1}"><i></i></button>`).join("")}</div>
      <div style="display:flex;justify-content:center;margin-top:18px">${C4.over ? '<button class="btn" data-act="c4-new">Play again</button>' : ""}</div>
      <p class="t-cap" style="text-align:center;margin-top:14px">Web preview: ${esc(opp.name)} is simulated.</p>`);
  }
  function c4Play(col) {
    if (C4.over || C4.turn !== "x") return;
    const at = c4Drop(C4.b, col, "x"); if (at < 0) return;
    C4.last = at; STATS.sent++; STATS.hourNow++;
    const w = c4Win(C4.b);
    if (w) { C4.over = w.who; C4.line = w.line; if (w.who === "x") C4.you++; render(); return; }
    C4.turn = "o"; render();
    later(800 + Math.random() * 600, () => {
      if (S.screen !== "c4" || C4.over) return;
      C4.last = c4Drop(C4.b, c4Ai(C4.b), "o"); C4.turn = "x";
      const w2 = c4Win(C4.b);
      if (w2) { C4.over = w2.who; C4.line = w2.line; if (w2.who === "o") C4.them++; }
      render();
    });
  }
  function vsHeader(opp, a, b, la = "", lb = "") {
    return `<div class="vs" style="margin:14px 0 4px">
      <div style="text-align:center">${avatar(S.avatar, "me", 48)}<div class="t-cap" style="margin-top:4px">You${la ? " · " + la : ""}</div></div>

      <div style="text-align:center">${avatar(opp.avatar, opp.id, 48, opp.presence)}<div class="t-cap" style="margin-top:4px">${esc(opp.name)}${lb ? " · " + lb : ""}</div></div></div>`;
  }

  // Word chain: each word starts with the last letter of the one before. Nature words only.
  const NATURE = ("acorn alder algae alpine amber ant antelope apple ash aspen aster aurora avalanche badger bamboo bark basil bay beach bear beaver bee beech beetle berry birch bison blossom boulder bramble brook buffalo bush butterfly cactus camel canyon cardinal cave cedar cheetah cherry chestnut cliff cloud clover cobra coconut condor coral cougar coyote crane creek crocodile crow cypress daisy deer delta desert dew dolphin dove dragonfly dune eagle earth eel egret elephant elk elm ember estuary falcon fern ferret field finch fir firefly fjord flamingo flower fog forest fox frog frost gale gazelle gecko geyser ginger giraffe glacier goat goose gorge grass grove gull hail hare hawk hazel heather hedgehog heron hill hippo holly honey horizon hornet ibex ibis iceberg iguana iris island ivy jackal jaguar jasmine jay jungle juniper kangaroo kelp kestrel kingfisher kite kiwi koala lagoon lake larch lark laurel lava leaf lemon leopard lichen lily lime lion lizard llama lotus lynx magnolia mango mangrove maple marsh meadow mist mole monsoon moose moss moth mountain mushroom nectar nest nettle newt nightingale oak oasis ocean octopus olive orchid osprey otter owl palm panda panther parrot peak pebble pelican pine plateau plum pond poplar poppy prairie puffin python quail quartz rabbit rain rainbow raven reed reef river robin rock rose sage salmon sand savanna seal sequoia shark shell shore sky sloth snail snow sparrow spruce squirrel stone stork stream sun swan swamp thistle thunder tide tiger toad tortoise tree tulip tundra turtle valley violet volcano vulture walnut walrus wasp waterfall wave whale wheat willow wind wolf woodpecker wren yak yew zebra").split(" ");
  const W = { words: [], over: null, opp: "ravi", msg: "" };
  function wordsView() {
    const opp = P[W.opp];
    const last = W.words.at(-1);
    const need = last ? last.w.slice(-1).toUpperCase() : null;
    return subScreen("Word chain", `
      ${vsHeader(opp, W.words.filter((x) => x.by === "me").length, W.words.filter((x) => x.by !== "me").length)}
      <p class="t-sub" style="text-align:center;margin:6px 0 14px">Nature words only. Each word starts with the last letter of the one before.</p>

        : W.turn === "them" ? `<p class="t-head" style="text-align:center;margin-top:18px">${esc(opp.name)} is thinking…</p>`

  function wordsPlay(raw) {
    const w = raw.trim().toLowerCase();
    const last = W.words.at(-1);
    if (!/^[a-z]{2,}$/.test(w)) { W.msg = "One word, letters only."; render(); return; }
    if (last && w[0] !== last.w.slice(-1)) { W.msg = `It has to start with "${last.w.slice(-1).toUpperCase()}".`; render(); return; }
    if (W.words.some((x) => x.w === w)) { W.msg = "That word was already used."; render(); return; }
    if (!NATURE.includes(w)) { W.msg = `"${w}" isn't in the nature word list. Try another.`; render(); return; }
    W.msg = ""; W.words.push({ w, by: "me" }); W.turn = "them"; STATS.sent++; STATS.hourNow++; render();
    later(1100 + Math.random() * 900, () => {
      if (S.screen !== "words" || W.over) return;
      const used = new Set(W.words.map((x) => x.w));
      const options = NATURE.filter((x) => x[0] === w.slice(-1) && !used.has(x));
      if (!options.length || (W.words.length > 8 && Math.random() < .25)) {
        W.over = "me"; W.msg = `${P[W.opp].name} couldn't think of a word starting with "${w.slice(-1).toUpperCase()}".`;
      } else W.words.push({ w: options[Math.floor(Math.random() * options.length)], by: W.opp });
      W.turn = "me"; render();
    });
  }

  // Treasure hunt: someone hid a spot nearby; follow "warmer / colder" using the compass.
  const H = {};
  function huntNew(opp) {
    const d = 120 + Math.random() * 100, b = Math.random() * 360;
    Object.assign(H, { opp, tx: d * Math.sin((b * Math.PI) / 180), ty: d * Math.cos((b * Math.PI) / 180), x: 0, y: 0, heading: 0, prev: d, hint: "Start walking. I'll tell you if you're getting warmer.", found: false, steps: 0 });
  }
  const huntDist = () => Math.hypot(H.tx - H.x, H.ty - H.y);
  function huntView() {
    const opp = P[H.opp] || P.asha;
    const d = huntDist();
    const heat = Math.max(0, Math.min(1, 1 - d / 240));
    const band = d < 15 ? "Found it!" : d < 40 ? "Very close" : d < 90 ? "Getting close" : d < 160 ? "Warm-ish" : "Far";
    return subScreen("Treasure hunt", `
      <div class="intro" style="padding-top:6px"><span style="font-size:52px">${H.found ? "🎁" : "🗺️"}</span>
        <h1 class="t-title">${H.found ? "You found it! 🎉" : esc(opp.name) + " hid a treasure"}</h1>
        <span class="t-sub">${H.found ? `In ${H.steps} moves. ${esc(opp.name)} has been notified.` : "Somewhere within about 250 m. Walk and listen for warmer or colder."}</span></div>
      <div class="group spec">
        <div class="spec-row"><span class="t-strong">${band}</span><span class="t-cap">${H.found ? "" : "Heading " + Math.round(H.heading) + "° " + cardinal(H.heading)}</span></div>
        <div class="heat" role="meter" aria-label="How close you are" aria-valuenow="${Math.round(heat * 100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(4, heat * 100)}%"></span></div>
        <p class="t-head" style="text-align:center" aria-live="polite">${esc(H.hint)}</p>
      </div>
      ${H.found ? '<div style="display:flex;justify-content:center;margin-top:18px"><button class="btn" data-act="hunt-new">Hunt again</button></div>' : `
      <div class="turn" style="margin-top:18px">
        <button class="btn small secondary" data-act="hunt-turn" data-v="-45">↺ Turn</button>
        <button class="btn" data-act="hunt-walk">Walk 20 m</button>
        <button class="btn small secondary" data-act="hunt-turn" data-v="45">Turn ↻</button></div>`}
      <p class="t-cap" style="text-align:center;margin-top:16px">Outdoors, the real compass and GPS drive this game. Web preview: your walking is simulated.</p>`);
  }
  function huntWalk() {
    const a = (H.heading * Math.PI) / 180;
    H.x += 20 * Math.sin(a); H.y += 20 * Math.cos(a); H.steps++;
    const d = huntDist();
    if (d < 15) { H.found = true; H.hint = "Treasure found!"; STATS.sent++; }
    else H.hint = d < H.prev - 2 ? (d < 50 ? "Hot! 🔥 Almost there" : "Warmer 🌤️") : d > H.prev + 2 ? "Colder 🧊 Try turning" : "About the same";
    H.prev = d; render();
  }

  // =====================================================================
  //  Round 3: receipts & delivery paths, SOS note, incoming SOS alert

  // ---------- what the two delivery paths are doing, in plain words ----------
  function pathText(m, path) {
    const p = P[m.to], o = m.paths[path], name = p ? p.name : "them";
    if (!o) return path === "direct" ? `Not possible: ${esc(name)} is far away` : "Not used";
    const t = o.time ? " · " + clock(o.time) : "";
    return {
      direct: { waiting: `Waiting for ${esc(name)} to come in range`, trying: "Sending now", delivered: "Delivered" + t,
        cancelled: "Not needed: delivered another way", discarded: "Arrived second. Discarded by message ID" },
      internet: { waiting: bridgeOnline() ? "Starting…" : "Waiting for someone nearby with internet (a bridge)", moving: "Travelling through Meera's internet",
        relay: `Stored at the relay until ${esc(name)} can be reached`, delivered: "Delivered" + t, cancelled: "Cancelled: delivered another way",
        discarded: "Arrived second. Discarded by message ID", "not-needed": "Not needed: delivered directly" },
    }[path][o.state] || o.state;
  }
  const pathDone = (s) => s === "delivered";
  const pathOff = (s) => ["cancelled", "discarded", "not-needed"].includes(s);

  /** One line under a message that is still waiting, or that won the race. */
  function pendingNote(m) {
    const p = P[m.to];
    if (!p || !m.paths) return "";
    const d = m.paths.direct, n = m.paths.internet;
    if (m.status === "pending") {
      if (n && n.state === "relay") return `⏳ Stored at the relay. Also goes by Bluetooth the moment ${esc(p.name)} is in range`;
      if (d && d.state === "waiting") return `⏳ Will go the first way possible: Bluetooth when ${esc(p.name)} is in range, or internet through a bridge`;
      return "⏳ Waiting for a bridge to the internet";
    }
    if (m.deliveredVia === "direct" && n && (n.state === "cancelled" || n.state === "discarded")) return "Delivered directly · internet copy " + (n.state === "cancelled" ? "cancelled" : "discarded");
    if (m.deliveredVia === "internet" && d && (d.state === "cancelled" || d.state === "discarded")) return "Delivered by internet · direct copy " + (d.state === "cancelled" ? "cancelled" : "discarded");
    return "";
  }

  // ---------- message info ----------
  const HOP_TEXT2 = {
    Ravi: "Hopped to Ravi's phone over Bluetooth",
    "Meera 🌐": "Reached Meera's phone, which has internet (the bridge)",

  function messageInfoView() {

    return subScreen("Message info", `
      <div class="parties">
        ${who("From", esc(S.name), "BM · " + fmtId(MY_ID), "This phone")}

        ${who("To", esc(to.name), to.sms ? esc(to.phone) : to.uid ? "BM · " + fmtId(to.uid) : "On this phone", to.sms ? "By text message" : to.remote || to.presence === "offline" ? "Out of range" : "Nearby")}

      <div class="status-card ${m.status === "read" || m.status === "delivered" ? "ok" : "wait"}">
        <span class="big-tick">${TICK[m.status] || ""}</span>
        <span><b style="display:block;font-size:18px">${statusWord}</b><span class="t-cap">${viaWord ? "by " + esc(viaWord) : pendingNote(m).replace("⏳ ", "") || "Sending"}</span></span>
      </div>

      <div class="group-label t-over">Receipts</div>
      <div class="group">${m.receipts.length ? m.receipts.map((r) => `<div class="set"><span class="tile" style="background:var(--pine)">${r.kind === "read" ? I.eye : I.check}</span>
          <span class="main"><span class="t-strong" style="display:block">${r.kind === "read" ? "Read" : "Delivered"} · ${secs(r.time)}</span><span class="t-cap">Receipt came back over ${esc(r.via)}</span></span></div>`).join("")
        : `<div class="set"><span class="main"><span class="t-sub">No receipt yet. You'll get one the moment it's delivered${to.sms ? "" : ", and another when it's read"}.</span></span></div>`}
        ${to.sms ? '<div class="set"><span class="main"><span class="t-cap">Text messages give a delivery receipt from the phone network, but no read receipt.</span></span></div>' : ""}</div>

      <div class="group-label t-over">Delivery paths · first one wins</div>

      <div class="group-label t-over">Journey</div>

      <div class="group-label t-over">History</div>
      <div class="group spec"><ol class="timeline">${(m.events || []).map((e) => `<li class="done"><i></i><span class="main"><span style="display:block">${esc(e.text)}</span><span class="t-cap num">${secs(e.time)}</span></span></li>`).join("")}</ol></div>

      <div class="group-label t-over">Duplicate protection</div>

  }

  // ---------- SOS note (optional) ----------
  S.sosNote = "";

  // ---------- receiving an SOS ----------
  S.alert = null;
  S.alertOpen = false;
  function receiveSos(fromId, text) {
    const p = P[fromId];
    if (!p || p.presence !== "online") return;
    p.sos = { time: now(), text, battery: 21 };
    S.alert = { from: fromId };
    S.alertOpen = true;
    convo(fromId).messages.push({ id: "m-" + uid(), me: false, text: "🆘 SOS: " + text, time: now() });
    if (S.chat !== fromId) convo(fromId).unread++;
    log("SOS received from " + p.name + ". Passed on to the bridge automatically");
    [0, 450, 900].forEach((d) => setTimeout(() => beep(260), d));
    render();
  }
  function sosAlertView() {
    if (!S.alertOpen || !S.alert) return "";
    const p = P[S.alert.from], s = p.sos;
    return `<div class="sos-alert" role="alertdialog" aria-label="SOS from ${esc(p.name)}">

  }

  // =====================================================================

  const SKY_APP = [
    { keys: ["where do you live", "are you online", "do you need internet", "are you on the internet", "is sky online", "where is my data", "privacy", "who can see", "are you ai", "are you chatgpt", "server"],

  // Live answers, read from the app's own state on this phone.
  const SKY_LIVE = [

      answer: () => {

  // Keys match at the start of a word, so "tick" doesn't fire inside "stick".
  const atWord = (t, k) => new RegExp("(^|[^a-z])" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(t);
  function skyAppAnswer(t) {
    for (const r of SKY_LIVE) if (r.keys.some((k) => atWord(t, k))) return r.answer();
    for (const r of SKY_APP) if (r.keys.some((k) => atWord(t, k))) return { text: r.text, actions: r.actions };

  // Keep "last seen" times fresh.
  setInterval(() => { if (S.onboarded && S.screen === "main" && (S.tab === "radar" || S.tab === "chats")) refresh(); }, 30000);

  render("fade");
  requestAnimationFrame(drawRadars);
