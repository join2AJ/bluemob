<title>BlueMob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   BlueMob design system  ·  "Pine & Sand"
   Calm like Signal (flat lists, one accent, lots of air), warm like Airbnb
   (sand neutrals, soft elevation, generous radii, confident display type).
   Layout: one phone-sized app column, centred on wide screens, full-bleed on phones.
   ========================================================================== */
:root {
  /* Color: neutrals lean warm (sand), the brand is a deep pine, ember marks the internet bridge */
  --canvas: #FFFFFF;
  --sand: #F6F4EF;
  --sand-2: #EDEAE3;
  --line: #E8E4DC;
  --ink: #15201B;
  --ink-2: #5D6A64;
  --ink-3: #98A29D;
  --pine: #11694E;
  --pine-press: #0B5A42;
  --on-pine: #FFFFFF;
  --pine-tint: #E2F1E9;
  --mint: #5FD3A3;
  --sky: #2F7BC0;
  --sky-tint: #E3EEF8;
  --ember: #E07F2E;
  --ember-tint: #FBEBDC;
  --rose: #D94F55;
  --online: #1FB26F;
  --away: #E9A23B;
  --offline: #B5BDB9;
  --bubble-them: #F1EEE8;
  --glass: rgba(255, 255, 255, .8);
  --stage: #E7E3DA;
  --night-1: #0A1B16;
  --night-2: #12382C;
  --shadow-1: 0 1px 2px rgba(21, 32, 27, .06), 0 2px 10px rgba(21, 32, 27, .05);
  --shadow-2: 0 10px 30px -10px rgba(21, 32, 27, .22);
  --shadow-frame: 0 40px 100px -40px rgba(21, 32, 27, .45);
  --c-direct: #16855C; --c-hop: #2F7BC0; --c-bridge: #C2621A;

  /* Type: Bricolage Grotesque for display moments, Figtree for everything you read */
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-hero: 34px; --t-title: 28px; --t-head: 20px; --t-body: 16px; --t-sub: 14px; --t-cap: 12px; --t-micro: 11px;

  /* Shape and space */
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;

  /* Motion: everything eases out; springs only for things you touch */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --d-1: 140ms; --d-2: 240ms; --d-3: 420ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0E1412; --sand: #0A0F0D; --sand-2: #18201D; --line: #212B27;
    --ink: #EDF2EF; --ink-2: #A3B0AA; --ink-3: #6C7873;
    --pine: #3FC897; --pine-press: #34B386; --on-pine: #05231A; --pine-tint: #123129; --mint: #5FD3A3;
    --sky: #7DB7EA; --sky-tint: #14283A; --ember: #F0A564; --ember-tint: #3A2614; --rose: #F0858A;
    --offline: #56625D; --bubble-them: #1B2421; --glass: rgba(14, 20, 18, .78); --stage: #050807;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -10px rgba(0, 0, 0, .6);
    --shadow-frame: 0 40px 100px -40px rgba(0, 0, 0, .9);
    --c-direct: #26A276; --c-hop: #3D8FD9; --c-bridge: #D27A2C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0E1412; --sand: #0A0F0D; --sand-2: #18201D; --line: #212B27;
  --ink: #EDF2EF; --ink-2: #A3B0AA; --ink-3: #6C7873;
  --pine: #3FC897; --pine-press: #34B386; --on-pine: #05231A; --pine-tint: #123129; --mint: #5FD3A3;
  --sky: #7DB7EA; --sky-tint: #14283A; --ember: #F0A564; --ember-tint: #3A2614; --rose: #F0858A;
  --offline: #56625D; --bubble-them: #1B2421; --glass: rgba(14, 20, 18, .78); --stage: #050807;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -10px rgba(0, 0, 0, .6);
  --shadow-frame: 0 40px 100px -40px rgba(0, 0, 0, .9);
  --c-direct: #26A276; --c-hop: #3D8FD9; --c-bridge: #D27A2C;
  color-scheme: dark;
}

/* ---------- base ---------- */
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font: 400 var(--t-body)/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--sky); outline-offset: 2px; border-radius: var(--r-xs); }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
p { margin: 0; }
svg { display: block; }

.stage { height: 100%; display: grid; place-items: center; padding-block: 16px; }
.app { position: relative; width: min(420px, 100%); height: min(880px, 100%); background: var(--canvas); border-radius: 36px; box-shadow: var(--shadow-frame); overflow: hidden; isolation: isolate; }
@media (max-width: 480px) { .stage { padding-block: 0; } .app { width: 100%; height: 100%; border-radius: 0; box-shadow: none; } }

/* ---------- type ---------- */
.t-hero { font: 700 var(--t-hero)/1.05 var(--font-display); letter-spacing: -.03em; }
.t-title { font: 700 var(--t-title)/1.1 var(--font-display); letter-spacing: -.025em; }
.t-head { font: 700 var(--t-head)/1.2 var(--font-display); letter-spacing: -.015em; }
.t-strong { font-weight: 600; }
.t-sub { font-size: var(--t-sub); color: var(--ink-2); }
.t-cap { font-size: var(--t-cap); color: var(--ink-2); }
.t-over { font-size: var(--t-micro); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- screen scaffold: glass app bar + large title + floating tab bar ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--canvas); }
.screen.grouped { background: var(--sand); }
.screen.push-in { animation: pushIn var(--d-3) var(--ease); }
.screen.fade-in { animation: fadeIn var(--d-2) var(--ease); }
@keyframes pushIn { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-3); transition: background var(--d-2), box-shadow var(--d-2); }
.bar.scrolled, .bar.solid { background: var(--glass); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: 0 1px 0 var(--line); }
.bar-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity var(--d-2), transform var(--d-2) var(--ease); padding-left: var(--s-1); }
.bar.scrolled .bar-title { opacity: 1; transform: none; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 60px var(--s-4) 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.large-title { margin: 4px 4px var(--s-4); }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }

.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background var(--d-1), transform var(--d-1) var(--ease); flex: none; }
.icon-btn:hover { background: var(--sand-2); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 22px; height: 22px; }

.tabbar { position: absolute; z-index: 4; left: 10px; right: 10px; bottom: 12px; height: 64px; border-radius: var(--r-pill); background: var(--glass); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; }
.tab-ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: var(--r-pill); background: var(--pine-tint); transition: transform var(--d-3) var(--spring); }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--t-micro); font-weight: 700; letter-spacing: .02em; color: var(--ink-3); border-radius: var(--r-pill); transition: color var(--d-2); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--pine); }
.tab .count { position: absolute; top: 4px; left: calc(50% + 6px); }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 48px; padding: 0 var(--s-6); border-radius: var(--r-pill); background: var(--pine); color: var(--on-pine); font-weight: 600; transition: transform var(--d-1) var(--ease), background var(--d-1), opacity var(--d-1); }
.btn:hover { background: var(--pine-press); }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn svg { width: 20px; height: 20px; }
.btn.secondary { background: var(--sand-2); color: var(--ink); }
.btn.text { background: none; color: var(--pine); height: 36px; padding: 0 var(--s-3); }
.btn.small { height: 36px; padding: 0 var(--s-4); font-size: var(--t-sub); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: var(--t-sub); font-weight: 600; background: var(--canvas); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: background var(--d-1), color var(--d-1), box-shadow var(--d-1); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--canvas); box-shadow: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: var(--t-micro); font-weight: 700; letter-spacing: .03em; background: var(--sand-2); color: var(--ink-2); white-space: nowrap; }
.tag.pine { background: var(--pine-tint); color: var(--pine); }
.tag.ember { background: var(--ember-tint); color: var(--ember); }
.tag.sky { background: var(--sky-tint); color: var(--sky); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--pine); color: var(--on-pine); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

.avatar { position: relative; flex: none; border-radius: 50%; display: grid; place-items: center; line-height: 1; }
.avatar .face { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; }
.avatar .badge { position: absolute; right: 0; bottom: 0; width: 27%; height: 27%; min-width: 10px; min-height: 10px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--canvas); }
/* An online person wears a pine ring, like a story ring */
.avatar.ring { padding: 3px; background: conic-gradient(from 200deg, var(--mint), var(--pine), var(--sky), var(--mint)); }
.avatar.ring .face { box-shadow: 0 0 0 2.5px var(--canvas); }

.switch { position: relative; width: 50px; height: 30px; border-radius: var(--r-pill); background: var(--sand-2); box-shadow: inset 0 0 0 1px var(--line); flex: none; transition: background var(--d-2); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform var(--d-3) var(--spring); }
.switch[aria-checked="true"] { background: var(--pine); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

.search { display: flex; align-items: center; gap: var(--s-2); height: 44px; padding: 0 var(--s-3); border-radius: var(--r-sm); background: var(--sand); color: var(--ink-3); }
.search svg { width: 20px; height: 20px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: var(--t-body); }
.search input::placeholder { color: var(--ink-3); }

.card { background: var(--canvas); border-radius: var(--r-lg); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.enter { animation: rise var(--d-3) var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.press { transition: background var(--d-1), transform var(--d-1) var(--ease); }
.press:active { transform: scale(.985); }

/* ---------- lists (Signal-style: flat rows, inset dividers) ---------- */
.rows { display: flex; flex-direction: column; margin: 0 calc(var(--s-4) * -1); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px var(--s-4); position: relative; }
.row:hover { background: var(--sand); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 82px; height: 1px; background: var(--line); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .line1 { display: flex; align-items: center; gap: 6px; }
.row .name { font-weight: 600; font-size: 16px; }
.row .preview { font-size: var(--t-sub); color: var(--ink-2); }
.row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: stretch; justify-content: center; }
.row .time { font-size: var(--t-cap); color: var(--ink-3); }
.row.unread .time { color: var(--pine); font-weight: 600; }
.row.unread .preview { color: var(--ink); }
.typing-text { color: var(--pine); font-weight: 500; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: var(--s-6) 4px var(--s-2); }

/* grouped settings lists (Signal settings) */
.group { background: var(--canvas); border-radius: var(--r-lg); overflow: hidden; }
.group-label { margin: var(--s-6) 12px var(--s-2); }
.set { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; position: relative; }
.set + .set::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; height: 1px; background: var(--line); }
button.set:hover { background: var(--sand); }
.tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.tile svg { width: 19px; height: 19px; }
.set .main { flex: 1; min-width: 0; }
.chev { width: 18px; height: 18px; color: var(--ink-3); flex: none; }

/* ---------- onboarding ---------- */
.onboard { position: absolute; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(120% 60% at 50% 0%, var(--sky-tint), transparent 70%),
  radial-gradient(120% 50% at 50% 100%, var(--pine-tint), transparent 70%), var(--canvas); }
.onboard-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; height: 56px; }
.wordmark { display: flex; align-items: center; gap: 8px; font: 800 20px/1 var(--font-display); letter-spacing: -.02em; }
.wordmark i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--sky), var(--pine)); display: grid; place-items: center; }
.wordmark i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.slide { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 8px 28px; animation: slideIn var(--d-3) var(--ease); }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
.slide p { max-width: 31ch; color: var(--ink-2); font-size: 17px; }
.hero { width: min(290px, 76%); aspect-ratio: 1; max-width: 100%; position: relative; display: grid; place-items: center; }
.onboard-bottom { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 24px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--line); transition: width var(--d-3) var(--ease), background var(--d-2); }
.dots span.on { width: 26px; background: var(--ink); }
.ripple { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 2.5px solid var(--sky); opacity: 0; animation: ripple 2.8s linear infinite; }
.ripple:nth-child(2) { animation-delay: .93s; } .ripple:nth-child(3) { animation-delay: 1.86s; }
@keyframes ripple { from { width: 30%; height: 30%; opacity: .6; } to { width: 100%; height: 100%; opacity: 0; } }
.node { position: absolute; border-radius: 50%; display: grid; place-items: center; line-height: 1; box-shadow: var(--shadow-2); background: var(--canvas); }
.hero-badge { position: absolute; top: 6%; right: 6%; width: 50px; height: 50px; border-radius: 16px; background: var(--ember-tint); color: var(--ember); display: grid; place-items: center; transform: rotate(8deg); }
.hero-badge svg { width: 26px; height: 26px; }
.bubble-demo { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.bubble-demo .b { max-width: 82%; padding: 10px 15px; border-radius: 20px; font-size: 16px; text-align: left; animation: bob 3s ease-in-out infinite; }
.bubble-demo .b.me { align-self: flex-end; background: var(--pine); color: var(--on-pine); border-bottom-right-radius: 6px; }
.bubble-demo .b.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 6px; animation-delay: .6s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.field label { display: block; text-align: left; margin: 0 0 6px 4px; }
.field input { width: 100%; height: 52px; padding: 0 16px; border-radius: var(--r-md); border: 0; background: var(--sand); color: var(--ink); font-size: 17px; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow var(--d-1); }
.field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--pine); }
.picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
.picker button { aspect-ratio: 1; border-radius: 14px; font-size: 24px; display: grid; place-items: center; background: var(--sand); transition: transform var(--d-2) var(--spring), background var(--d-1), box-shadow var(--d-1); }
.picker button[aria-pressed="true"] { background: var(--pine-tint); box-shadow: inset 0 0 0 2px var(--pine); transform: scale(1.06); }
.me-badge { width: 104px; height: 104px; border-radius: 34px; background: linear-gradient(140deg, var(--sky), var(--pine)); display: grid; place-items: center; font-size: 52px; box-shadow: var(--shadow-2); flex: none; transform: rotate(-4deg); }

/* ---------- radar ---------- */
.night { position: relative; border-radius: var(--r-xl); overflow: hidden; color: #EAF5F0; background: radial-gradient(120% 90% at 50% 40%, var(--night-2), var(--night-1) 70%); box-shadow: var(--shadow-2); }
.night-top { position: absolute; z-index: 2; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; }
.live { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: rgba(255,255,255,.1); font-size: var(--t-micro); font-weight: 700; letter-spacing: .08em; backdrop-filter: blur(6px); }
.live .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(95,211,163,.7); animation: beacon 1.6s infinite; }
.live.off .pulse { background: #8C9A94; animation: none; }
@keyframes beacon { to { box-shadow: 0 0 0 10px rgba(95,211,163,0); } }
.night .switch { background: rgba(255,255,255,.18); box-shadow: none; }
.night .switch[aria-checked="true"] { background: var(--mint); }
.radar-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; }
.radar-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.blip { position: absolute; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; transition: left 1s var(--ease), top 1s var(--ease), opacity var(--d-3); }
.blip .face { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 18px 2px var(--glow, transparent); }
.blip .badge { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--night-1); }
.blip:hover { z-index: 2; }
.night-foot { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.stat-line { display: flex; gap: 16px; }
.stat-line div { display: flex; flex-direction: column; }
.stat-line b { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat-line span { font-size: var(--t-micro); opacity: .7; letter-spacing: .04em; margin-top: 3px; }
.scale { font-size: var(--t-micro); opacity: .6; text-align: right; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: var(--r-pill); background: var(--sand); position: relative; }
.seg button { position: relative; z-index: 1; height: 36px; border-radius: var(--r-pill); font-size: var(--t-sub); font-weight: 600; color: var(--ink-2); transition: color var(--d-2); }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .knob { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: var(--r-pill); background: var(--canvas); box-shadow: var(--shadow-1); transition: transform var(--d-3) var(--spring); }
.seg.right .knob { transform: translateX(100%); }

.hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 calc(var(--s-4) * -1); padding: 4px var(--s-4) 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.pcard { scroll-snap-align: start; flex: none; width: 148px; text-align: left; border-radius: var(--r-lg); background: var(--canvas); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); overflow: hidden; }
.pcard .art { height: 96px; display: grid; place-items: center; font-size: 44px; position: relative; }
.pcard .art .tag { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.85); color: #15201B; }
.pcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.feature { display: flex; gap: 14px; align-items: center; padding: 16px; text-align: left; width: 100%; }
.feature .tile { width: 48px; height: 48px; border-radius: 15px; }
.feature .tile svg { width: 24px; height: 24px; }

/* ---------- chats ---------- */
.stories { display: flex; gap: 14px; overflow-x: auto; margin: 0 calc(var(--s-4) * -1); padding: 4px var(--s-4) 4px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; flex: none; font-size: var(--t-cap); font-weight: 500; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: var(--s-4) calc(var(--s-4) * -1) var(--s-2); padding: 0 var(--s-4); }

/* ---------- chat ---------- */
.chat-bar { gap: 6px; padding-left: 6px; }
.chat-bar .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.chat-bar .who b { display: block; font-size: 16px; }
.messages { flex: 1; overflow-y: auto; padding: 68px 14px 8px; display: flex; flex-direction: column; scrollbar-width: none; }
.messages::-webkit-scrollbar { display: none; }
.intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18px 12px 22px; }
.intro p { max-width: 30ch; }
.day { align-self: center; margin: 8px 0 12px; }
.msg { display: flex; flex-direction: column; max-width: 80%; margin-top: 2px; }
.msg.gap { margin-top: 10px; }
.msg.new { animation: bubbleIn var(--d-3) var(--spring); }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 9px 14px; border-radius: 20px; background: var(--bubble-them); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.38; }
.msg.me .bubble { background: var(--pine); color: var(--on-pine); }
.msg.them.first .bubble { border-bottom-left-radius: 6px; }
.msg.them.mid .bubble { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.msg.them.last .bubble { border-top-left-radius: 6px; }
.msg.me.first .bubble { border-bottom-right-radius: 6px; }
.msg.me.mid .bubble { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.msg.me.last .bubble { border-top-right-radius: 6px; }
.meta { display: flex; align-items: center; gap: 5px; margin: 4px 6px 0; font-size: var(--t-micro); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.meta svg { width: 15px; height: 15px; }
.meta .ok { color: var(--pine); }
.meta .fail { color: var(--rose); font-weight: 600; }
.typing { align-self: flex-start; margin-top: 10px; padding: 14px 16px; border-radius: 20px; border-bottom-left-radius: 6px; background: var(--bubble-them); display: flex; gap: 4px; animation: bubbleIn var(--d-3) var(--spring); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: bounce 1.2s infinite var(--ease); }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

/* The journey a message takes through the mesh and the bridge */
.msg.routed { max-width: 92%; }
.journey { list-style: none; display: flex; margin: 8px 0 2px; padding: 10px 8px 8px; border-radius: var(--r-md); background: var(--sand); width: 300px; max-width: 100%; }
.journey li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; font-size: 10.5px; font-weight: 600; color: var(--ink-3); min-width: 0; text-align: center; }
.journey li::before { content: ""; position: absolute; top: 5px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; transition: background var(--d-3); }
.journey li:first-child::before { display: none; }
.journey i { position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; background: var(--canvas); box-shadow: inset 0 0 0 2px var(--line); transition: background var(--d-3), box-shadow var(--d-3); }
.journey li.done { color: var(--ink-2); }
.journey li.done i { background: var(--pine); box-shadow: none; }
.journey li.done::before, .journey li.now::before { background: var(--pine); }
.journey li.now { color: var(--ember); }
.journey li.now i { background: var(--ember); box-shadow: 0 0 0 4px var(--ember-tint); animation: hop 1s infinite var(--ease); }
@keyframes hop { 50% { box-shadow: 0 0 0 7px var(--ember-tint); } }
.journey-note { font-size: var(--t-micro); color: var(--ink-3); margin: 2px 6px 0; }

.suggest { display: flex; gap: 8px; overflow-x: auto; padding: 6px 14px 4px; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.composer-wrap { padding: 6px 10px 12px; }
.composer-note { font-size: var(--t-cap); color: var(--ink-2); text-align: center; padding: 0 16px 8px; }
.composer { display: flex; align-items: flex-end; gap: 8px; }
.field-pill { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; min-height: 46px; padding: 0 4px 0 6px; border-radius: 24px; background: var(--sand); }
.field-pill input { flex: 1; min-width: 0; height: 46px; border: 0; background: none; outline: none; font-size: 16px; padding: 0 6px; color: var(--ink); }
.field-pill input::placeholder { color: var(--ink-3); }
.field-pill .icon-btn { width: 36px; height: 36px; color: var(--ink-2); }
.field-pill .icon-btn:hover { background: var(--sand-2); }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--pine); color: var(--on-pine); display: grid; place-items: center; flex: none; transition: transform var(--d-2) var(--spring), background var(--d-1); }
.send:active { transform: scale(.88); }
.send svg { width: 22px; height: 22px; }
.send.mic { background: var(--sand); color: var(--ink-2); }
.send:disabled { opacity: .45; cursor: default; }

/* ---------- profile ---------- */
.me-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 8px 0 4px; }
.idline { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--ink-2); padding: 8px 12px; border-radius: var(--r-pill); background: var(--canvas); }
.idline svg { width: 14px; height: 14px; }
.log { font: 12px/1.6 var(--font-mono); color: var(--ink-2); padding: 4px 16px 14px; max-height: 220px; overflow-y: auto; }

/* ---------- style guide ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.swatch { display: flex; flex-direction: column; gap: 6px; font-size: var(--t-micro); }
.swatch i { height: 56px; border-radius: var(--r-md); box-shadow: inset 0 0 0 1px var(--line); }
.swatch b { font-size: var(--t-cap); }
.spec { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.spec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.radii { display: flex; gap: 10px; flex-wrap: wrap; }
.radii div { width: 56px; height: 56px; background: var(--pine-tint); box-shadow: inset 0 0 0 1.5px var(--pine); display: grid; place-items: end center; padding-bottom: 4px; font-size: 10px; color: var(--pine); font-weight: 700; }
.curve { display: flex; align-items: center; gap: 12px; }
.curve .track { flex: 1; height: 6px; border-radius: 3px; background: var(--sand-2); position: relative; }
.curve .track span { position: absolute; top: -5px; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--pine); animation: travel 1.6s infinite alternate; }
@keyframes travel { to { left: calc(100% - 16px); } }

.toast { position: absolute; z-index: 9; left: 50%; bottom: 92px; transform: translate(-50%, 16px); max-width: calc(100% - 32px); padding: 12px 18px; border-radius: var(--r-pill); background: var(--ink); color: var(--canvas); font-size: var(--t-sub); font-weight: 500; box-shadow: var(--shadow-2); opacity: 0; pointer-events: none; transition: opacity var(--d-2), transform var(--d-3) var(--spring); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.screen.chat-screen ~ .toast, .toast.high { bottom: 96px; }


/* ---------- identity ---------- */
.uid { font: 600 11px/1 var(--font-mono); letter-spacing: .04em; color: var(--ink-3); }
.id-card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r-md); background: var(--sand); text-align: left; width: 100%; }
.id-card .big { font: 600 15px/1.2 var(--font-mono); letter-spacing: .06em; color: var(--ink); }
.safety { display: flex; justify-content: center; gap: 10px; font-size: 30px; padding: 6px 0; }
.battery-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--sand); font-size: var(--t-cap); font-weight: 700; }
.battery-chip.on { background: var(--pine-tint); color: var(--pine); }
.battery-chip svg { width: 18px; height: 18px; }
.bar .spacer { flex: 1; }

/* ---------- power ---------- */
.gauge { position: relative; height: 22px; border-radius: 8px; background: var(--pine-tint); overflow: hidden; }
.gauge span { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--pine); transition: width var(--d-3) var(--ease); }
.hours { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hours div { padding: 14px; border-radius: var(--r-md); background: var(--sand); }
.hours div.win { background: var(--pine-tint); }
.hours b { display: block; font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: 6px; }
.step-done { color: var(--pine); font-weight: 700; font-size: var(--t-cap); }

/* ---------- insights ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile-stat { padding: 14px; border-radius: var(--r-md); background: var(--canvas); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.tile-stat b { display: block; font: 600 26px/1.1 var(--font-body); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile-stat .delta { font-size: var(--t-cap); color: var(--ink-2); }
.stackbar { display: flex; gap: 2px; height: 22px; margin: 12px 0 10px; }
.stackbar span { height: 100%; transition: flex-grow var(--d-3) var(--ease); }
.stackbar span:first-child { border-radius: 4px 0 0 4px; } .stackbar span:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-cap); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); padding: 6px 10px; border-radius: var(--r-xs); background: var(--ink); color: var(--canvas); font-size: var(--t-cap); white-space: nowrap; opacity: 0; transition: opacity var(--d-1); }
.chart .tip.show { opacity: 1; }
.dtable { width: 100%; border-collapse: collapse; font-size: var(--t-sub); font-variant-numeric: tabular-nums; }
.dtable th, .dtable td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.dtable td:last-child, .dtable th:last-child { text-align: right; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--pine-tint); position: relative; overflow: hidden; }
.meter span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--pine); }

/* ---------- compass ---------- */
.compass { position: relative; width: min(300px, 82%); aspect-ratio: 1; margin: 4px auto 0; max-width: 100%; }
.compass .dial { position: absolute; inset: 0; transition: transform var(--d-3) var(--ease); }
.compass .needle { position: absolute; inset: 0; display: grid; place-items: center; transition: transform var(--d-3) var(--spring); }
.compass .hub { position: absolute; inset: 0; margin: auto; width: 96px; height: 96px; border-radius: 50%; background: var(--canvas); box-shadow: var(--shadow-2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.compass .hub b { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.targets { display: flex; gap: 8px; overflow-x: auto; margin: 0 calc(var(--s-4) * -1); padding: 2px var(--s-4) 6px; scrollbar-width: none; }
.targets::-webkit-scrollbar { display: none; }
.minimap { border-radius: var(--r-lg); overflow: hidden; background: var(--sand); }
.minimap svg { width: 100%; height: auto; display: block; }
.turn { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }

/* ---------- guide ---------- */
.sos-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sos-btn { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: var(--r-md); text-align: left; }
.sos-btn svg { width: 24px; height: 24px; flex: none; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--canvas); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); text-align: left; min-width: 0; }
.cat .tile { width: 36px; height: 36px; border-radius: 11px; }
.cat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--pine); }
.article h1 { margin-top: 10px; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--pine-tint); color: var(--pine); font-weight: 700; font-size: var(--t-sub); display: grid; place-items: center; }
.donts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.donts li { display: flex; gap: 10px; }
.donts li::before { content: "✕"; color: var(--rose); font-weight: 800; }
.callout { padding: 12px 14px; border-radius: var(--r-md); background: var(--ember-tint); color: var(--ink); font-size: var(--t-sub); }
.sos-screen { position: absolute; inset: 0; z-index: 8; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 24px; text-align: center; }
.sos-screen.flash { background: #fff; color: #000; }
.sos-screen .morse { font: 700 34px/1 var(--font-mono); letter-spacing: .12em; white-space: nowrap; }

/* ---------- games ---------- */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(300px, 100%); margin: 0 auto; }
.cell { aspect-ratio: 1; border-radius: var(--r-md); background: var(--canvas); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); font: 800 44px/1 var(--font-display); display: grid; place-items: center; transition: background var(--d-1), transform var(--d-2) var(--spring); }
.cell:not(:disabled):hover { background: var(--pine-tint); }
.cell.x { color: var(--pine); } .cell.o { color: var(--ember); }
.cell.win { background: var(--pine-tint); }
.cell.pop { animation: popIn var(--d-3) var(--spring); }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.vs { display: flex; align-items: center; justify-content: center; gap: 16px; }
.vs .score { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer { padding: 14px 16px; border-radius: var(--r-md); background: var(--canvas); box-shadow: inset 0 0 0 1.5px var(--line); text-align: left; font-weight: 500; transition: background var(--d-1), box-shadow var(--d-1); }
.answer:not(:disabled):hover { box-shadow: inset 0 0 0 1.5px var(--pine); }
.answer.right { background: var(--pine-tint); box-shadow: inset 0 0 0 2px var(--pine); }
.answer.wrong { background: var(--ember-tint); box-shadow: inset 0 0 0 2px var(--rose); }
.gcard { scroll-snap-align: start; flex: none; width: 168px; padding: 14px; border-radius: var(--r-lg); text-align: left; display: flex; flex-direction: column; gap: 8px; color: #fff; min-height: 150px; }
.gcard .em { font-size: 34px; }
.idea { display: flex; gap: 12px; align-items: flex-start; }
.idea .em { font-size: 26px; width: 40px; text-align: center; flex: none; }


/* ---------- round 2 ---------- */
.bot-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bot-actions .chip { height: 32px; font-size: 13px; }
.msg.tappable { cursor: pointer; }
.route-strip { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 14px; background: var(--sand); border-bottom: 1px solid var(--line); font-size: var(--t-cap); color: var(--ink-2); text-align: left; position: absolute; top: 56px; left: 0; right: 0; z-index: 2; }
.route-strip b { color: var(--ink); font-weight: 600; }
.route-strip .chev { margin-left: auto; }
.messages.with-strip { padding-top: 104px; }
.parties { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.party { display: flex; flex-direction: column; gap: 3px; padding: 12px; border-radius: var(--r-md); background: var(--canvas); min-width: 0; }
.party b { font-size: 16px; }
.party .uid { overflow-wrap: anywhere; line-height: 1.3; }
.parties .arrow { color: var(--pine); width: 22px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li.done::before { background: var(--pine); }
.timeline i { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; flex: none; background: var(--canvas); box-shadow: inset 0 0 0 2px var(--line); position: relative; z-index: 1; }
.timeline li.done i { background: var(--pine); box-shadow: none; }
.timeline li.wait i { background: var(--ember); box-shadow: 0 0 0 4px var(--ember-tint); }
.sos-hero { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0 8px; text-align: center; }
.sos-big { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F0727A, var(--rose) 60%, #A8323A); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 12px rgba(217,79,85,.14), 0 0 0 26px rgba(217,79,85,.07), var(--shadow-2); transition: transform var(--d-2) var(--spring); }
.sos-big b { font: 800 46px/1 var(--font-display); letter-spacing: .04em; }
.sos-big span { font-size: var(--t-sub); opacity: .9; margin-top: 6px; }
.sos-big:active { transform: scale(.95); }
.sos-big.armed { animation: armed 0.9s infinite; }
@keyframes armed { 50% { box-shadow: 0 0 0 18px rgba(217,79,85,.28), 0 0 0 36px rgba(217,79,85,.1), var(--shadow-2); } }
.pay-options { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 2px 54px; }
.pay-options p { flex-basis: 100%; }
.games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.game-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r-lg); background: var(--canvas); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); text-align: left; min-height: 128px; min-width: 0; }
.game-tile .em { font-size: 30px; margin-bottom: 4px; }
.game-tile .tag { margin-top: auto; }
.invite { position: absolute; z-index: 6; left: 12px; right: 12px; top: 60px; padding: 14px; border-radius: var(--r-lg); background: var(--canvas); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--line); animation: dropIn var(--d-3) var(--spring); }
@keyframes dropIn { from { transform: translateY(-120%); } to { transform: none; } }
.invite-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.c4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 10px; border-radius: var(--r-lg); background: var(--c-hop); width: min(340px, 100%); margin: 0 auto; }
.c4-cell { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.c4-cell i { width: 100%; height: 100%; border-radius: 50%; background: var(--canvas); box-shadow: inset 0 3px 6px rgba(0,0,0,.25); }
.c4-cell.x i { background: var(--mint); } .c4-cell.o i { background: var(--ember); }
.c4-cell.win i { box-shadow: 0 0 0 3px #fff, inset 0 3px 6px rgba(0,0,0,.2); }
.c4-cell.drop i { animation: dropDisc var(--d-3) var(--ease); }
@keyframes dropDisc { from { transform: translateY(-160%); } to { transform: none; } }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: 14px; border-radius: var(--r-lg); background: var(--canvas); min-height: 64px; }
.chain .link { padding: 6px 12px; border-radius: var(--r-pill); background: var(--ember-tint); font-weight: 600; }
.chain .link.mine { background: var(--pine-tint); color: var(--pine); }
.heat { height: 14px; border-radius: 7px; background: var(--sky-tint); overflow: hidden; }
.heat span { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--sky), var(--ember), var(--rose)); transition: width var(--d-3) var(--ease); }

/* ---------- round 3 ---------- */
.sos-pill { height: 32px; padding: 0 14px; border-radius: var(--r-pill); background: var(--rose); color: #fff; font: 800 13px/1 var(--font-body); letter-spacing: .08em; box-shadow: 0 4px 14px -4px rgba(217,79,85,.6); transition: transform var(--d-1) var(--ease); }
.sos-pill:active { transform: scale(.94); }
.status-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-lg); background: var(--canvas); }
.status-card .big-tick { color: var(--ink-3); display: grid; place-items: center; width: 40px; }
.status-card.ok .big-tick { color: var(--pine); }
.status-card .big-tick svg { width: 30px; height: 30px; }
.note-field { width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 0; background: var(--sand); color: var(--ink); font: inherit; resize: none; box-shadow: inset 0 0 0 1.5px transparent; }
.note-field:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--rose); }
.sig-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 22px; }
.sig-mode { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--r-md); background: rgba(127,127,127,.18); color: inherit; font-size: 22px; }
.sig-mode span { font-size: 12px; font-weight: 600; }
.sig-mode[aria-pressed="true"] { background: var(--rose); color: #fff; }
.torch { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 44px; opacity: .35; transition: opacity 80ms, filter 80ms; }
.torch span { font-size: 12px; font-weight: 600; }
.torch.on { opacity: 1; filter: drop-shadow(0 0 24px #FFE9A8) drop-shadow(0 0 8px #fff); }
.sos-ring { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--rose); animation: sosring 1.2s infinite; }
@keyframes sosring { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.sos-alert { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--canvas); animation: fadeIn var(--d-2) var(--ease); }
.sos-alert-head { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; background: var(--rose); }
.sos-alert-head .pulse { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: beacon 1s infinite; box-shadow: 0 0 0 0 rgba(255,255,255,.8); }
.sos-alert-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 28px 24px 12px; }
.sos-quote { margin: 14px 0 6px; padding: 14px 16px; border-radius: var(--r-md); background: var(--sand); font-size: 18px; font-weight: 500; max-width: 32ch; }
.sos-alert-actions { display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 24px; }
.sos-alert-actions .btn:first-child { background: var(--rose); color: #fff; height: 56px; font-size: 17px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

  convo("sky").messages = SKY_GREETING.map((t) => ({ id: uid(), me: false, text: t, time: now() }));
  convo("sky").unread = 1;

  // Live counters for the insights screen.
  const STATS = { sent: 0, delivered: 0, direct: 0, hopped: 0, bridge: 0, relayed: 0, hourNow: 0 };
  const later = (ms, fn) => { const t = setTimeout(fn, ms); S.timers.push(t); return t; };

  function incoming(id, text, actions) {
    const c = convo(id);
    c.messages.push({ id: uid(), me: false, text, time: now(), actions });
    if (S.chat !== id) c.unread++;
    refresh();
  }

  /** msg is a string or { text, actions }. Shows typing first, like a real person. */
  function reply(id, msg, opts = {}) {
    const { text, actions } = typeof msg === "string" ? { text: msg } : msg;
    const c = convo(id);
    later(opts.wait ?? 500, () => {
      c.typing = true; refresh();
      later(Math.min(700 + text.length * 14, 2800), () => {
        c.typing = false;
        incoming(id, text, actions);
      });
    });
  }
  const friendReply = (id, text) => (FRIEND[id] ? pickReply(FRIEND[id].rules, FRIEND[id].fallback, text) : null);

  // =====================================================================
  //  Delivery engine: store-and-forward over two paths, exactly-once delivery
  // ---------------------------------------------------------------------
  //  Every message has one unique ID. It can travel two ways:
  //   • direct:   Bluetooth / Wi-Fi, the moment the person is in range
  //   • internet: through a bridge (someone nearby with internet) to the relay,
  //               which hands it over once the person is reachable online
  //  The first path to deliver wins. The delivery receipt cancels the other path,
  //  the relay deletes its stored copy, and if a copy still arrives the receiver
  //  recognises the ID and discards it. So a message is shown exactly once.
  // =====================================================================
  const hasInternet = (p) => p.remote || !!p.home;   // far-away people are online where they are
  const PATH_LABEL = { direct: "Bluetooth / Wi-Fi", internet: "Internet" };

  function send(id, text, opts = {}) {
    text = text.trim();
    if (!text) return;
    const c = convo(id);
    const m = { id: "m-" + uid() + uid().slice(0, 4), me: true, text, time: now(), status: "sending", to: id,
      onDelivered: opts.onDelivered, receipts: [], paths: {}, events: [] };
    c.messages.push(m);
    STATS.sent++; STATS.hourNow++;
    refresh();

    if (id === "sky") {
      // Sky runs inside the app: nothing is sent anywhere, so no network ticks or receipts.
      m.status = "local";
      reply("sky", skyReply(text), { wait: 500 });
      return m;
    }
    const p = P[id];
    if (!p.remote) m.paths.direct = { state: p.presence === "online" ? "trying" : "waiting" };
    m.paths.internet = { state: "waiting" };
    note(m, "Written on your phone · ID " + m.id);
    if (p.presence === "online" && !p.remote) {
      m.paths.internet.state = "not-needed";
      deliverDirect(m, id);
    } else {
      m.status = "pending";
      note(m, p.remote ? "Waiting for a bridge to the internet" : `${p.name} isn't in range. Waiting for whichever comes first: ${p.name} in range, or a bridge`);
      if (bridgeOnline()) sendViaBridge(m, id); else { convo(id).queue.push(m); refresh(); }
    }
    return m;
  }
  function note(m, text) { m.events.push({ time: now(), text }); }

  function deliverDirect(m, id) {
    const p = P[id];
    m.paths.direct.state = "trying";
    Object.assign(m, { route: ["You", p.name], hop: 0, hopTimes: [now()] });
    note(m, `${p.name} is in range. Sending directly over ${p.link}`);
    later(150 + p.rtt, () => { if (m.status === "sending" || m.status === "pending") m.status = "sent"; refresh(); });
    later(400 + p.rtt * 3, () => { m.hop = 1; m.hopTimes.push(now()); delivered(m, id, "direct", p.link); });
  }

  /** Called when a copy reaches the person. Only the first copy counts. */
  function delivered(m, id, path, how) {
    const p = P[id];
    if (m.deliveredVia) {
      m.paths[path].state = "discarded";
      STATS.dupes = (STATS.dupes || 0) + 1;
      note(m, `A second copy arrived by ${PATH_LABEL[path]}. ${p ? p.name + "'s" : "Their"} phone recognised the ID and discarded it`);
      log("Duplicate of a message to " + (p ? p.name : id) + " discarded by ID");
      refresh();
      return;
    }
    m.deliveredVia = path;
    m.paths[path].state = "delivered";
    m.paths[path].time = now();
    m.status = "delivered";
    STATS.delivered++;
    if (path === "direct") STATS.direct++; else { STATS.bridge++; if (m.route && m.route.includes("Ravi")) STATS.hopped++; }
    const back = path === "direct" ? how : "the internet and the bridge";
    m.receipts.push({ kind: "delivered", time: now(), via: back });
    note(m, `Delivered by ${path === "direct" ? how : p && p.sms ? "text message" : "internet"}. Delivery receipt came back over ${back}`);
    // The receipt stops the other path.
    const other = path === "direct" ? "internet" : "direct";
    const o = m.paths[other];
    if (o) {
      if (o.state === "waiting") { o.state = "cancelled"; note(m, `${PATH_LABEL[other]} copy cancelled before it was sent`); }
      else if (o.state === "relay") { o.state = "cancelled"; note(m, "The relay deleted its stored copy after the delivery receipt"); }
      else if (o.state === "moving") note(m, `An internet copy is still travelling. If it arrives, it will be discarded`);
    }
    convo(id).queue = convo(id).queue.filter((x) => x !== m);
    if (m.onDelivered) m.onDelivered();
    refresh();
    // Read receipt: SMS has none; people read it a little later.
    if (id !== "sky" && !(p && p.sms)) later(1800 + Math.random() * 2500, () => {
      m.status = "read"; m.receipts.push({ kind: "read", time: now(), via: back }); note(m, "Read receipt received"); refresh();
    });
    if (id === "sky") later(600, () => { m.status = "read"; m.receipts.push({ kind: "read", time: now(), via: "this phone" }); refresh(); });
    const r = id !== "sky" && friendReply(id, m.text);
    if (r && Math.random() < 0.9) reply(id, r, { wait: 2200 });
  }

  // A → B → C (has internet) → internet → relay → D, played out hop by hop.
  const bridgeOnline = () => S.mesh && P.meera.presence === "online";
  function routeFor(p) {
    const hops = ["You"];
    if (P.ravi.presence === "online") hops.push("Ravi");
    hops.push("Meera 🌐", "Internet");
    if (p.sms) hops.push("SMS");
    hops.push(p.name);
    return hops;
  }
  function sendViaBridge(m, id) {
    const p = P[id];
    if (m.deliveredVia) { if (m.paths.internet.state === "waiting") m.paths.internet.state = "cancelled"; return; }
    if (!bridgeOnline()) { if (!convo(id).queue.includes(m)) convo(id).queue.push(m); m.paths.internet.state = "waiting"; refresh(); return; }
    m.paths.internet.state = "moving";
    if (m.status === "sending" || m.status === "pending") m.status = "sent";
    // Keep the direct route on screen if it already won; otherwise show the internet route.
    if (!m.route || m.route.length < 3) Object.assign(m, { route: routeFor(p), hop: 0, hopTimes: [now()] });
    note(m, "A bridge is nearby (Meera has internet). Internet copy on its way");
    refresh();
    const step = () => {
      m.hop++;
      m.hopTimes.push(now());
      const arrived = m.route[m.hop] === "Internet";
      if (arrived && !hasInternet(p)) {
        // The person has no internet either: the relay keeps it until they can be reached.
        if (m.deliveredVia) { m.paths.internet.state = "cancelled"; note(m, "Reached the relay after delivery. The relay dropped it"); refresh(); return; }
        m.paths.internet.state = "relay";
        m.status = "pending";
        note(m, `Stored safely at the relay. ${p.name} has no internet either, so it waits there`);
        refresh();
        return;
      }
      if (m.hop >= m.route.length - 1) { delivered(m, id, "internet", p.sms ? "text message" : "internet"); return; }
      refresh();
      later(900, step);
    };
    later(700, step);
  }
  function flushBridgeQueue() {
    let i = 0;
    for (const [id, c] of Object.entries(S.convos)) {
      c.queue.splice(0).forEach((m) => later(600 + i++ * 450, () => sendViaBridge(m, id)));
    }
    flushSos();
  }
  /** Someone came into range: hand over everything waiting for them, directly. */
  function flushDirect(id) {
    const c = S.convos[id];
    if (!c) return;
    c.messages.filter((m) => m.me && !m.deliveredVia && m.paths && m.paths.direct && m.paths.direct.state === "waiting")
      .forEach((m, i) => later(500 + i * 300, () => { if (!m.deliveredVia) deliverDirect(m, id); }));
  }

  // ---------- mesh simulation ----------
  function log(text) {
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    S.log.unshift(t + "  " + text);
    S.log = S.log.slice(0, 120);
  }
  function setPresence(id, presence) {
    const p = P[id];
    p.presence = presence;
    p.met = true;
    p.lastSeen = now();
    if (presence === "online") {
      log("Connected to " + p.name + " (" + p.link + ")");
      flushDirect(id);
      if (id === "meera") { log("Meera has internet: she can bridge messages out"); flushBridgeQueue(); }
    } else if (presence === "range") {
      log("Found " + p.name);
    }
    refresh();
  }
  function startMesh() {
    if (S.mesh) return;
    S.mesh = true;
    log("Mesh on: visible to nearby phones, scanning…");
    later(1200, () => setPresence("asha", "range"));
    later(2300, () => setPresence("asha", "online"));
    later(3000, () => setPresence("ravi", "range"));
    later(4400, () => setPresence("ravi", "online"));
    later(5600, () => setPresence("meera", "range"));
    later(7200, () => setPresence("meera", "online"));
    later(9800, () => setPresence("asha2", "range"));
    later(11400, () => setPresence("asha2", "online"));
    later(16000, () => maybeInvite());
    later(48000, () => { if (!P.ravi.sos) receiveSos("ravi", "Twisted my ankle near the stream. Can't walk. Please bring a torch"); });
    later(30000, () => setPresence("tara", "range"));
    later(31500, () => setPresence("tara", "online"));
    later(9000, () => { if (S.mesh && convo("asha").messages.length === 0) incoming("asha", "Hey! Saw you pop up on my radar 👋"); });
    refresh();
  }
  function stopMesh() {
    if (!S.mesh) return;
    S.mesh = false;
    S.timers.forEach(clearTimeout);
    S.timers = [];
    for (const p of Object.values(P)) {
      if (p.presence === "online" || p.presence === "range") { p.presence = "offline"; p.lastSeen = now(); }
    }
    for (const c of Object.values(S.convos)) c.typing = false;
    log("Mesh off");
    refresh();
  }

  // People drift a little, so distances feel alive.
  setInterval(() => {
    if (!S.mesh) return;
    for (const id of ["asha", "ravi", "meera", "asha2", "tara"]) {
      const p = P[id];
      if (p.presence !== "online") continue;
      p.dist = Math.max(8, p.dist * (0.97 + Math.random() * 0.06));
      p.bearing = (p.bearing + (Math.random() - 0.5) * 6 + 360) % 360;
    }
    if (S.tab === "radar" && S.screen === "main" && S.onboarded) { placeBlips(); updatePeopleText(); }
  }, 4000);


  // ---------- extra UI state ----------
  Object.assign(S, { screen: "main", query: "", filter: "all", prevTab: S.tab, seen: new Set(), stack: [] });
  if (!["radar", "chats", "compass", "guide", "you"].includes(S.tab)) S.tab = "radar";

  // ---------- formatting ----------
  function fmtDist(m) {
    if (m < 10) return "a few m";
    if (m < 1000) return Math.round(m / 5) * 5 + " m";
    if (m < 10000) return (m / 1000).toFixed(1) + " km";
    return Math.round(m / 1000).toLocaleString() + " km";
  }
  function ago(t) {
    const s = Math.max(0, (now() - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return Math.floor(s / 86400) + " d ago";
  }
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const stamp = (t) => (now() - t < 60e3 ? "now" : clock(t));
  const PCOLOR = { online: "var(--online)", range: "var(--away)", offline: "var(--offline)", remote: "var(--sky)" };
  const ORDER = { online: 0, range: 1, offline: 2, remote: 3 };

  function statusLine(p) {
    if (p.sms) return esc(p.phone) + " · text message " + (bridgeOnline() ? "via Meera's internet" : "when a bridge appears");
    if (p.id === "experts") return "Volunteer medics and rangers · " + (bridgeOnline() ? "via Meera's internet" : "when a bridge appears");
    if (p.remote) return bridgeOnline() ? "2,000 km away · via Meera's internet" : "2,000 km away · waiting for a bridge";
    if (p.presence === "online") return ["Online", S.shareLoc ? fmtDist(p.dist) + " away" : null, p.link].filter(Boolean).join(" · ");
    if (p.presence === "range") return "In range · connecting…";
    return "Seen " + ago(p.lastSeen) + (p.home ? " · now in " + p.home.split(",")[0] : S.shareLoc ? " · was " + fmtDist(p.dist) + " away" : "") + " · reach by ID";
  }

  // Avatar: emoji on a soft tint. Online people get a ring, others a small status badge.
  function avatar(emoji, seed, size, presence) {
    const ring = presence === "online";
    const badge = presence && !ring ? `<span class="badge" style="background:${PCOLOR[presence]}"></span>` : "";
    return `<span class="avatar${ring ? " ring" : ""}" style="width:${size}px;height:${size}px">
      <span class="face" style="background:${tint(seed)};font-size:${Math.round(size * (ring ? .44 : .5))}px">${esc(emoji)}</span>${badge}</span>`;
  }

  // ---------- rendering core ----------
  const app = document.getElementById("app");
  let toastTimer;
  function toast(text) {
    let el = app.querySelector(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); app.appendChild(el); }
    el.textContent = text;
    el.classList.toggle("high", S.screen === "chat");
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function refresh() {
    if (!S.onboarded) return;
    if (S.screen === "chat") { renderChatParts(); return; }
    if (["main", "insights", "person", "soshub", "info", "lobby", "money"].includes(S.screen)) render();
  }

  // Screen stack: open() pushes, back() pops.
  function open(screen, params = {}) {
    S.stack.push({ screen: S.screen, chat: S.chat, article: S.article, person: S.person });
    Object.assign(S, { screen }, params);
    render("push");
  }
  function back() {
    clearTimeout(sosTimer);
    const prev = S.stack.pop() || { screen: "main" };
    Object.assign(S, prev);
    render("fade");
  }

  /** anim: "fade" when switching tabs, "push" when opening a screen, none for live updates. */
  function render(anim) {
    const active = document.activeElement;
    const focusId = active && active.id, caret = active && active.selectionStart;
    const keepScroll = !anim ? app.querySelector("#scroll")?.scrollTop ?? 0 : 0;
    const toastEl = app.querySelector(".toast");

    if (!S.onboarded) { app.innerHTML = onboardingView(); afterOnboardingRender(); return; }
    S._anim = anim;
    const SCREENS = { design: designView, power: powerView, insights: insightsView, article: articleView, ttt: tttView,
      quiz: quizView, games: gamesIdeasView, person: personView, soshub: sosHubView, contacts: contactsView, info: messageInfoView,
      money: moneyView, play: gamesHubView, lobby: lobbyView, c4: c4View, words: wordsView, hunt: huntView };
    if (S.screen === "chat") { app.innerHTML = chatView(anim); renderChatParts(true); }
    else if (S.screen === "sos") { app.innerHTML = sosView(); clearTimeout(sosTimer); startSos(); }
    else if (SCREENS[S.screen]) app.innerHTML = SCREENS[S.screen](anim);
    else app.innerHTML = mainView(anim);

    if (S.alertOpen) app.insertAdjacentHTML("beforeend", sosAlertView());
    if (toastEl) app.appendChild(toastEl);
    const sc = app.querySelector("#scroll");
    if (sc) { sc.scrollTop = keepScroll; syncBar(sc); }
    if (S.screen === "main" && S.tab === "radar") placeBlips();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
    }
    if (S.screen === "main") requestAnimationFrame(() => {
      const ind = app.querySelector(".tab-ind");
      if (ind) ind.style.transform = `translateX(${TABS.findIndex((t) => t.id === S.tab) * 100}%)`;
    });
  }
  function syncBar(sc) {
    const bar = app.querySelector(".bar");
    if (bar && !bar.classList.contains("solid")) bar.classList.toggle("scrolled", sc.scrollTop > 36);
  }
  app.addEventListener("scroll", (e) => { if (e.target.id === "scroll") syncBar(e.target); }, true);

  // ---------- onboarding ----------
  const SLIDES = [
    { art: "offgrid", title: "Talk freely, anywhere", body: "No towers. No internet. BlueMob links phones directly over Bluetooth and Wi-Fi: in the mountains, at sea, or when the network goes down." },
    { art: "hops", title: "Every phone is a path", body: "Messages hop from friend to friend until they reach the right person. The more people around, the further your voice travels." },
    { art: "bridge", title: "One signal frees everyone", body: "If just one person nearby has internet, the whole group can reach the world through them." },
    { art: "radar", title: "See who's around", body: "A live radar shows who's online, how far away they are, and when you last saw them." },
    { art: "buddy", title: "Never alone", body: "Chat with Sky, your built-in buddy, to feel what talking off-grid is like before friends join." },
  ];
  const node = (emoji, x, y, size, seed) =>
    `<span class="node" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;margin:${-size / 2}px;font-size:${size / 2}px;background:${tint(seed)}">${emoji}</span>`;
  function heroArt(kind) {
    if (kind === "offgrid") return `<div class="hero"><span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
      ${node("📱", 50, 50, 92, "me")}<span class="hero-badge">${I.signalOff}</span></div>`;
    if (kind === "hops") return `<div class="hero"><svg viewBox="0 0 300 300" width="100%" height="100%" aria-hidden="true">
      <path id="hopPath" d="M45 210 L150 90 L255 210" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
      <circle r="16" fill="var(--ember)" opacity=".22"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#hopPath"/></animateMotion></circle>
      <circle r="7" fill="var(--ember)"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#hopPath"/></animateMotion></circle></svg>
      ${node("🦅", 15, 70, 64, "a")}${node("🌊", 50, 30, 64, "b")}${node("⛰️", 85, 70, 64, "c")}</div>`;
    if (kind === "bridge") return `<div class="hero"><svg viewBox="0 0 300 300" width="100%" height="100%" aria-hidden="true">
      <path d="M54 234 L135 258 L234 222" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <line x1="234" y1="222" x2="150" y2="60" stroke="var(--pine)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite"/></line></svg>
      ${node("🌻", 18, 78, 56, "f0")}${node("🍀", 45, 86, 56, "f1")}${node("📶", 78, 74, 56, "f2")}${node("🌍", 50, 20, 88, "earth")}</div>`;
    if (kind === "radar") return `<div class="hero"><div class="night" style="width:100%;height:100%;border-radius:50%"><div class="radar-wrap" data-demo="1"><canvas></canvas></div></div></div>`;
    return `<div class="hero"><div class="bubble-demo"><div class="b me">Hi Sky! 👋</div><div class="b them">Hey! 🌤️ Ready to explore?</div><div class="b me">Let's go! 🚀</div></div></div>`;
  }
  function onboardingView() {
    const last = S.slide === SLIDES.length;
    const s = SLIDES[S.slide];
    const content = last ? `
      <div class="slide">
        <span class="me-badge" id="ob-avatar">${esc(S.avatar)}</span>
        <h1 class="t-title" style="margin-top:8px">Who are you out there?</h1>
        <p>Pick a name and a spirit. People nearby will see these, next to your unique ID.</p>
        <span class="idline" style="background:var(--sand)">BM · ${fmtId(MY_ID)}</span>
        <div class="field" style="width:100%;margin-top:6px"><label class="t-over" for="ob-name">Your name</label>
          <input id="ob-name" maxlength="24" autocomplete="nickname" placeholder="e.g. Arjun" value="${esc(S.name)}"></div>
        <div class="picker" role="group" aria-label="Choose an avatar">${AVATARS.map((a) =>
          `<button data-act="pick-avatar" data-v="${a}" aria-pressed="${a === S.avatar}">${a}</button>`).join("")}</div>
      </div>` : `
      <div class="slide">
        ${heroArt(s.art)}
        ${s.art === "hops" || s.art === "bridge" ? '<span class="tag ember">COMING TO ANDROID · TRY IT IN THIS PREVIEW</span>' : ""}
        <h1 class="t-hero" style="margin-top:6px">${s.title}</h1>
        <p>${s.body}</p>
      </div>`;
    return `<div class="onboard">
      <div class="onboard-top"><span class="wordmark"><i></i>BlueMob</span>
        ${last ? "" : '<button class="btn text" data-act="skip">Skip</button>'}</div>
      ${content}
      <div class="onboard-bottom">
        <div class="dots" aria-hidden="true">${Array.from({ length: SLIDES.length + 1 }, (_, i) => `<span class="${i === S.slide ? "on" : ""}"></span>`).join("")}</div>
        <button class="btn" data-act="${last ? "finish" : "next"}" id="ob-next" ${last && !S.name.trim() ? "disabled" : ""}>
          ${last ? "Start exploring" : "Continue"} ${I.send}</button>
      </div></div>`;
  }
  function afterOnboardingRender() {
    const input = document.getElementById("ob-name");
    if (!input) return;
    input.addEventListener("input", () => {
      S.name = input.value.replace(/\|/g, " ").slice(0, 24);
      document.getElementById("ob-next").disabled = !S.name.trim();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && S.name.trim()) finishOnboarding(); });
  }
  function finishOnboarding() {
    S.name = S.name.trim() || "Explorer";
    S.onboarded = true;
    store.set("name", S.name); store.set("avatar", S.avatar); store.set("onboarded", true);
    S.tab = "radar"; S.screen = "main";
    render("fade");
    later(500, startMesh);
  }

  // ---------- main shell ----------
  const TABS = [
    { id: "radar", label: "Nearby", icon: I.radar },
    { id: "chats", label: "Chats", icon: I.chat },
    { id: "compass", label: "Compass", icon: I.compass },
    { id: "guide", label: "Guide", icon: I.book },
    { id: "you", label: "You", icon: I.person },
  ];
  function mainView(anim) {

  // ---------- Nearby (radar) ----------
  function greeting() {
    const h = new Date().getHours();
    return h >= 5 && h < 12 ? "Good morning" : h >= 12 && h < 17 ? "Good afternoon" : h >= 17 && h < 22 ? "Good evening" : "Hello, night owl";
  }
  const nearby = () => Object.values(P).filter((p) => !p.remote && p.met);
  function radarView() {
    const list = nearby().sort((a, b) => ORDER[a.presence] - ORDER[b.presence] || b.lastSeen - a.lastSeen);
    const PF = { all: () => true, online: (p) => p.presence === "online", internet: (p) => p.internet && p.presence === "online",

    const SORTS = { near: ["Nearest", (a, b) => ORDER[a.presence] - ORDER[b.presence] || a.dist - b.dist],
      recent: ["Last seen", (a, b) => b.lastSeen - a.lastSeen], name: ["Name", (a, b) => a.name.localeCompare(b.name)] };
    const shown = list.filter(PF[S.peopleFilter]).sort(SORTS[S.sort][1]);
    const online = list.filter((p) => p.presence === "online").length;
    const range = list.filter((p) => p.presence === "range").length;
    const bridge = bridgeOnline();
    return `
      <div class="large-title"><div class="t-sub">${greeting()}, ${esc(S.name)}</div><h1 class="t-hero">Nearby</h1></div>

        }).join("")}</div>
        <div class="night-foot">
          <div class="stat-line num"><div><b>${online}</b><span>online</span></div><div><b>${range}</b><span>in range</span></div><div><b>${list.length}</b><span>met</span></div></div>
          <div class="scale">${S.shareLoc ? "10 m · 300 m · 10 km" : "inner ring = online"}</div>
        </div>

      <div class="seg ${S.shareLoc ? "right" : ""}" role="group" aria-label="Radar view" style="margin-top:14px">

      </div>

      <div class="section-h"><h2 class="t-head">Around you</h2><button class="btn text" data-act="sort" aria-label="Change sort order">Sort: ${SORTS[S.sort][0]} ⇅</button></div>
      <div class="filters" role="group" aria-label="Filter people" style="margin-top:0">${[["all", "All " + list.length], ["online", "Online"], ["internet", "Has internet"], ["close", "Under 500 m"], ["wifi", "Wi-Fi link"]].map(([v, l]) =>
        `<button class="chip" data-act="people-filter" data-v="${v}" aria-pressed="${S.peopleFilter === v}">${l}</button>`).join("")}</div>
      ${list.length && !shown.length ? '<p class="t-sub" style="padding:12px 4px">No one matches this filter right now.</p>' : ""}
      ${shown.length ? `<div class="hscroll">${shown.map(personCard).join("")}</div>`
        : `<div class="card" style="padding:20px;text-align:center"><div style="font-size:34px">🏕️</div>
            <div class="t-strong" style="margin-top:6px">Quiet out here</div>
            <div class="t-sub">Switch the mesh on. People nearby appear as they open BlueMob.</div></div>`}

      <div class="section-h"><h2 class="t-head">Reach further</h2></div>
      <div class="stack" style="gap:10px">
        <button class="card feature press" data-act="open-chat" data-id="dee">
          <span class="tile" style="background:${bridge ? "var(--pine)" : "var(--ember)"}">${bridge ? I.globe : I.cloudOff}</span>
          <span style="flex:1;min-width:0"><span class="t-strong" style="display:block">${bridge ? "Meera is your bridge to the world" : "You're off-grid"}</span>
            <span class="t-sub">${bridge ? "She has internet. Message Dee, 2,000 km away, and watch it travel." : "No internet nearby yet. Messages to faraway friends will wait for a bridge."}</span></span>
          <span class="chev">${I.chevron}</span></button>
        <button class="card feature press" data-act="money">
          <span class="tile" style="background:#3A9A5B">${I.wallet}</span>
          <span style="flex:1;min-width:0"><span class="t-strong" style="display:block">Trip money</span>

        <button class="card feature press" data-act="insights">
          <span class="tile" style="background:var(--c-hop)">${I.chart}</span>
