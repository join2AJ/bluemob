<title>BlueMob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   BlueMob design system  ·  "Pine & Sand"
   Calm like Signal (flat lists, one accent, lots of air), warm like Airbnb
   (sand neutrals, soft elevation, generous radii, confident display type).
   Layout: one phone-sized app column, centred on wide screens, full-bleed on phones.
   ========================================================================== */
:root {
  /* Color: neutrals lean warm (sand), the brand is a deep pine, ember marks the internet bridge */
  --canvas: #FFFFFF;
  --sand: #F6F4EF;
  --sand-2: #EDEAE3;
  --line: #E8E4DC;
  --ink: #15201B;
  --ink-2: #5D6A64;
  --ink-3: #98A29D;
  --pine: #11694E;
  --pine-press: #0B5A42;
  --on-pine: #FFFFFF;
  --pine-tint: #E2F1E9;
  --mint: #5FD3A3;
  --sky: #2F7BC0;
  --sky-tint: #E3EEF8;
  --ember: #E07F2E;
  --ember-tint: #FBEBDC;
  --rose: #D94F55;
  --online: #1FB26F;
  --away: #E9A23B;
  --offline: #B5BDB9;
  --bubble-them: #F1EEE8;
  --glass: rgba(255, 255, 255, .8);
  --stage: #E7E3DA;
  --night-1: #0A1B16;
  --night-2: #12382C;
  --shadow-1: 0 1px 2px rgba(21, 32, 27, .06), 0 2px 10px rgba(21, 32, 27, .05);
  --shadow-2: 0 10px 30px -10px rgba(21, 32, 27, .22);
  --shadow-frame: 0 40px 100px -40px rgba(21, 32, 27, .45);

  /* Type: Bricolage Grotesque for display moments, Figtree for everything you read */
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-hero: 34px; --t-title: 28px; --t-head: 20px; --t-body: 16px; --t-sub: 14px; --t-cap: 12px; --t-micro: 11px;

  /* Shape and space */
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;

  /* Motion: everything eases out; springs only for things you touch */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --d-1: 140ms; --d-2: 240ms; --d-3: 420ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0E1412; --sand: #0A0F0D; --sand-2: #18201D; --line: #212B27;
    --ink: #EDF2EF; --ink-2: #A3B0AA; --ink-3: #6C7873;
    --pine: #3FC897; --pine-press: #34B386; --on-pine: #05231A; --pine-tint: #123129; --mint: #5FD3A3;
    --sky: #7DB7EA; --sky-tint: #14283A; --ember: #F0A564; --ember-tint: #3A2614; --rose: #F0858A;
    --offline: #56625D; --bubble-them: #1B2421; --glass: rgba(14, 20, 18, .78); --stage: #050807;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -10px rgba(0, 0, 0, .6);
    --shadow-frame: 0 40px 100px -40px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0E1412; --sand: #0A0F0D; --sand-2: #18201D; --line: #212B27;
  --ink: #EDF2EF; --ink-2: #A3B0AA; --ink-3: #6C7873;
  --pine: #3FC897; --pine-press: #34B386; --on-pine: #05231A; --pine-tint: #123129; --mint: #5FD3A3;
  --sky: #7DB7EA; --sky-tint: #14283A; --ember: #F0A564; --ember-tint: #3A2614; --rose: #F0858A;
  --offline: #56625D; --bubble-them: #1B2421; --glass: rgba(14, 20, 18, .78); --stage: #050807;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4); --shadow-2: 0 12px 30px -10px rgba(0, 0, 0, .6);
  --shadow-frame: 0 40px 100px -40px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

/* ---------- base ---------- */
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font: 400 var(--t-body)/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--sky); outline-offset: 2px; border-radius: var(--r-xs); }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
p { margin: 0; }
svg { display: block; }

.stage { height: 100%; display: grid; place-items: center; padding-block: 16px; }
.app { position: relative; width: min(420px, 100%); height: min(880px, 100%); background: var(--canvas); border-radius: 36px; box-shadow: var(--shadow-frame); overflow: hidden; isolation: isolate; }
@media (max-width: 480px) { .stage { padding-block: 0; } .app { width: 100%; height: 100%; border-radius: 0; box-shadow: none; } }

/* ---------- type ---------- */
.t-hero { font: 700 var(--t-hero)/1.05 var(--font-display); letter-spacing: -.03em; }
.t-title { font: 700 var(--t-title)/1.1 var(--font-display); letter-spacing: -.025em; }
.t-head { font: 700 var(--t-head)/1.2 var(--font-display); letter-spacing: -.015em; }
.t-strong { font-weight: 600; }
.t-sub { font-size: var(--t-sub); color: var(--ink-2); }
.t-cap { font-size: var(--t-cap); color: var(--ink-2); }
.t-over { font-size: var(--t-micro); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- screen scaffold: glass app bar + large title + floating tab bar ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--canvas); }
.screen.grouped { background: var(--sand); }
.screen.push-in { animation: pushIn var(--d-3) var(--ease); }
.screen.fade-in { animation: fadeIn var(--d-2) var(--ease); }
@keyframes pushIn { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-3); transition: background var(--d-2), box-shadow var(--d-2); }
.bar.scrolled, .bar.solid { background: var(--glass); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); box-shadow: 0 1px 0 var(--line); }
.bar-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity var(--d-2), transform var(--d-2) var(--ease); padding-left: var(--s-1); }
.bar.scrolled .bar-title { opacity: 1; transform: none; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 60px var(--s-4) 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.large-title { margin: 4px 4px var(--s-4); }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }

.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background var(--d-1), transform var(--d-1) var(--ease); flex: none; }
.icon-btn:hover { background: var(--sand-2); }
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 22px; height: 22px; }

.tabbar { position: absolute; z-index: 4; left: 12px; right: 12px; bottom: 12px; height: 64px; border-radius: var(--r-pill); background: var(--glass); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); box-shadow: var(--shadow-2), inset 0 0 0 1px var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; }
.tab-ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: var(--r-pill); background: var(--pine-tint); transition: transform var(--d-3) var(--spring); }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--t-micro); font-weight: 700; letter-spacing: .02em; color: var(--ink-3); border-radius: var(--r-pill); transition: color var(--d-2); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--pine); }
.tab .count { position: absolute; top: 4px; left: calc(50% + 6px); }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 48px; padding: 0 var(--s-6); border-radius: var(--r-pill); background: var(--pine); color: var(--on-pine); font-weight: 600; transition: transform var(--d-1) var(--ease), background var(--d-1), opacity var(--d-1); }
.btn:hover { background: var(--pine-press); }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn svg { width: 20px; height: 20px; }
.btn.secondary { background: var(--sand-2); color: var(--ink); }
.btn.text { background: none; color: var(--pine); height: 36px; padding: 0 var(--s-3); }
.btn.small { height: 36px; padding: 0 var(--s-4); font-size: var(--t-sub); }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-pill); font-size: var(--t-sub); font-weight: 600; background: var(--canvas); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: background var(--d-1), color var(--d-1), box-shadow var(--d-1); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--canvas); box-shadow: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: var(--t-micro); font-weight: 700; letter-spacing: .03em; background: var(--sand-2); color: var(--ink-2); white-space: nowrap; }
.tag.pine { background: var(--pine-tint); color: var(--pine); }
.tag.ember { background: var(--ember-tint); color: var(--ember); }
.tag.sky { background: var(--sky-tint); color: var(--sky); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--pine); color: var(--on-pine); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

.avatar { position: relative; flex: none; border-radius: 50%; display: grid; place-items: center; line-height: 1; }
.avatar .face { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; }
.avatar .badge { position: absolute; right: 0; bottom: 0; width: 27%; height: 27%; min-width: 10px; min-height: 10px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--canvas); }
/* An online person wears a pine ring, like a story ring */
.avatar.ring { padding: 3px; background: conic-gradient(from 200deg, var(--mint), var(--pine), var(--sky), var(--mint)); }
.avatar.ring .face { box-shadow: 0 0 0 2.5px var(--canvas); }

.switch { position: relative; width: 50px; height: 30px; border-radius: var(--r-pill); background: var(--sand-2); box-shadow: inset 0 0 0 1px var(--line); flex: none; transition: background var(--d-2); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform var(--d-3) var(--spring); }
.switch[aria-checked="true"] { background: var(--pine); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

.search { display: flex; align-items: center; gap: var(--s-2); height: 44px; padding: 0 var(--s-3); border-radius: var(--r-sm); background: var(--sand); color: var(--ink-3); }
.search svg { width: 20px; height: 20px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: var(--t-body); }
.search input::placeholder { color: var(--ink-3); }

.card { background: var(--canvas); border-radius: var(--r-lg); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.enter { animation: rise var(--d-3) var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.press { transition: background var(--d-1), transform var(--d-1) var(--ease); }
.press:active { transform: scale(.985); }

/* ---------- lists (Signal-style: flat rows, inset dividers) ---------- */
.rows { display: flex; flex-direction: column; margin: 0 calc(var(--s-4) * -1); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px var(--s-4); position: relative; }
.row:hover { background: var(--sand); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 82px; height: 1px; background: var(--line); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .line1 { display: flex; align-items: center; gap: 6px; }
.row .name { font-weight: 600; font-size: 16px; }
.row .preview { font-size: var(--t-sub); color: var(--ink-2); }
.row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: stretch; justify-content: center; }
.row .time { font-size: var(--t-cap); color: var(--ink-3); }
.row.unread .time { color: var(--pine); font-weight: 600; }
.row.unread .preview { color: var(--ink); }
.typing-text { color: var(--pine); font-weight: 500; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin: var(--s-6) 4px var(--s-2); }

/* grouped settings lists (Signal settings) */
.group { background: var(--canvas); border-radius: var(--r-lg); overflow: hidden; }
.group-label { margin: var(--s-6) 12px var(--s-2); }
.set { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; position: relative; }
.set + .set::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; height: 1px; background: var(--line); }
button.set:hover { background: var(--sand); }
.tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.tile svg { width: 19px; height: 19px; }
.set .main { flex: 1; min-width: 0; }
.chev { width: 18px; height: 18px; color: var(--ink-3); flex: none; }

/* ---------- onboarding ---------- */
.onboard { position: absolute; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(120% 60% at 50% 0%, var(--sky-tint), transparent 70%),
  radial-gradient(120% 50% at 50% 100%, var(--pine-tint), transparent 70%), var(--canvas); }
.onboard-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; height: 56px; }
.wordmark { display: flex; align-items: center; gap: 8px; font: 800 20px/1 var(--font-display); letter-spacing: -.02em; }
.wordmark i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--sky), var(--pine)); display: grid; place-items: center; }
.wordmark i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.slide { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 8px 28px; animation: slideIn var(--d-3) var(--ease); }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
.slide p { max-width: 31ch; color: var(--ink-2); font-size: 17px; }
.hero { width: min(290px, 76%); aspect-ratio: 1; max-width: 100%; position: relative; display: grid; place-items: center; }
.onboard-bottom { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 24px; }
.dots { display: flex; gap: 6px; }
.dots span { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--line); transition: width var(--d-3) var(--ease), background var(--d-2); }
.dots span.on { width: 26px; background: var(--ink); }
.ripple { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 2.5px solid var(--sky); opacity: 0; animation: ripple 2.8s linear infinite; }
.ripple:nth-child(2) { animation-delay: .93s; } .ripple:nth-child(3) { animation-delay: 1.86s; }
@keyframes ripple { from { width: 30%; height: 30%; opacity: .6; } to { width: 100%; height: 100%; opacity: 0; } }
.node { position: absolute; border-radius: 50%; display: grid; place-items: center; line-height: 1; box-shadow: var(--shadow-2); background: var(--canvas); }
.hero-badge { position: absolute; top: 6%; right: 6%; width: 50px; height: 50px; border-radius: 16px; background: var(--ember-tint); color: var(--ember); display: grid; place-items: center; transform: rotate(8deg); }
.hero-badge svg { width: 26px; height: 26px; }
.bubble-demo { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.bubble-demo .b { max-width: 82%; padding: 10px 15px; border-radius: 20px; font-size: 16px; text-align: left; animation: bob 3s ease-in-out infinite; }
.bubble-demo .b.me { align-self: flex-end; background: var(--pine); color: var(--on-pine); border-bottom-right-radius: 6px; }
.bubble-demo .b.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 6px; animation-delay: .6s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.field label { display: block; text-align: left; margin: 0 0 6px 4px; }
.field input { width: 100%; height: 52px; padding: 0 16px; border-radius: var(--r-md); border: 0; background: var(--sand); color: var(--ink); font-size: 17px; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow var(--d-1); }
.field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--pine); }
.picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
.picker button { aspect-ratio: 1; border-radius: 14px; font-size: 24px; display: grid; place-items: center; background: var(--sand); transition: transform var(--d-2) var(--spring), background var(--d-1), box-shadow var(--d-1); }
.picker button[aria-pressed="true"] { background: var(--pine-tint); box-shadow: inset 0 0 0 2px var(--pine); transform: scale(1.06); }
.me-badge { width: 104px; height: 104px; border-radius: 34px; background: linear-gradient(140deg, var(--sky), var(--pine)); display: grid; place-items: center; font-size: 52px; box-shadow: var(--shadow-2); flex: none; transform: rotate(-4deg); }

/* ---------- radar ---------- */
.night { position: relative; border-radius: var(--r-xl); overflow: hidden; color: #EAF5F0; background: radial-gradient(120% 90% at 50% 40%, var(--night-2), var(--night-1) 70%); box-shadow: var(--shadow-2); }
.night-top { position: absolute; z-index: 2; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; }
.live { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: rgba(255,255,255,.1); font-size: var(--t-micro); font-weight: 700; letter-spacing: .08em; backdrop-filter: blur(6px); }
.live .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgba(95,211,163,.7); animation: beacon 1.6s infinite; }
.live.off .pulse { background: #8C9A94; animation: none; }
@keyframes beacon { to { box-shadow: 0 0 0 10px rgba(95,211,163,0); } }
.night .switch { background: rgba(255,255,255,.18); box-shadow: none; }
.night .switch[aria-checked="true"] { background: var(--mint); }
.radar-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; }
.radar-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.blip { position: absolute; z-index: 1; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; transition: left 1s var(--ease), top 1s var(--ease), opacity var(--d-3); }
.blip .face { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 18px 2px var(--glow, transparent); }
.blip .badge { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--night-1); }
.blip:hover { z-index: 2; }
.night-foot { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.stat-line { display: flex; gap: 16px; }
.stat-line div { display: flex; flex-direction: column; }
.stat-line b { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat-line span { font-size: var(--t-micro); opacity: .7; letter-spacing: .04em; margin-top: 3px; }
.scale { font-size: var(--t-micro); opacity: .6; text-align: right; }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: var(--r-pill); background: var(--sand); position: relative; }
.seg button { position: relative; z-index: 1; height: 36px; border-radius: var(--r-pill); font-size: var(--t-sub); font-weight: 600; color: var(--ink-2); transition: color var(--d-2); }
.seg button[aria-pressed="true"] { color: var(--ink); }

<script>
(() => {

  const AVATARS = ["🌿", "🦅", "🌊", "⛰️", "🌻", "🦋", "🐬", "🔥", "🌙", "🍀", "🐺", "🌵"];

  const tint = (seed) => TINTS[Math.abs([...seed].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) % TINTS.length];

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- storage (best effort) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("bluemob:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("bluemob:" + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },

  // ---------- state ----------
  const now = () => Date.now();
  const S = {
    name: store.get("name", ""),
    avatar: store.get("avatar", "🦅"),
    onboarded: store.get("onboarded", false),
    shareLoc: store.get("shareLoc", false),
    slide: 0,

    chat: null,
    mesh: false,
    showLog: false,
    log: [],
    convos: {},

  };

  // Simulated people. In the Android app these come from real Bluetooth / Wi-Fi discovery.
  const PEOPLE = {
    asha:  { name: "Asha",  avatar: "🦋", dist: 42,   bearing: 60,  link: "fast Wi-Fi link", rtt: 18 },
    ravi:  { name: "Ravi",  avatar: "🐬", dist: 380,  bearing: 200, link: "Bluetooth link", rtt: 64 },
    meera: { name: "Meera", avatar: "🌵", dist: 920,  bearing: 310, link: "good link", rtt: 41, internet: true },

  const P = {};
  for (const [id, p] of Object.entries(PEOPLE)) {
    P[id] = { id, ...p, presence: "offline", met: false, lastSeen: 0 };
  }
  // Kabir was met on an earlier trip; Dee is a friend far away, reachable only through the internet.
  Object.assign(P.kabir, { met: true, lastSeen: now() - 2 * 3600e3 });
  Object.assign(P.dee, { met: true, presence: "remote" });

  const SKY = { id: "sky", name: "Sky", avatar: "🌤️" };

  // ---------- Sky, the practice bot (same rules as the Android app) ----------
  const SKY_GREETING = [
    "Hey there! 👋 I'm Sky, your BlueMob buddy.",
    "I live right here on your phone, so we can chat even with zero signal. Try saying hi, or tap one of the suggestions below.",
  ];
  const SKY_SUGGEST = ["Hi 👋", "How does BlueMob work?", "What can I do here?", "Tell me a joke"];
  const SKY_RULES = [
    [["hello", "hi", "hey", "hii", "namaste", "hola", "yo"], [

    [["how are you", "how r u", "wassup", "what's up", "sup"], [

    [["good", "fine", "great", "awesome", "nice", "cool"], [
      "Love that! 🌻",
      "Awesome 🙌. Want to know how BlueMob reaches people without signal? Just ask \"how does it work\"."]],
    [["how does", "how it works", "how do", "work", "bluetooth", "wifi", "wi-fi", "mesh"], [
      "Here's the magic ✨: phones running BlueMob find each other over Bluetooth and Wi-Fi and link up directly. No SIM, no towers, no internet.\n\nEvery phone can pass messages along, so a message can hop A → B → C to reach someone out of your range. And if one phone nearby has internet, it can carry the group's messages to the wider world. Try messaging Dee once Meera is online to watch it happen!"]],
    [["what can", "feature", "help", "do here", "options"], [
      "Here's what you can do:\n📡 Radar: see who's around, how far and when they were last online\n💬 Chats: message anyone nearby\n🌍 Reach Dee, 2,000 km away, through a friend's internet\n📍 Share your location so friends see the distance\n🙋 Your profile: pick a name and an avatar"]],

    [["who are you", "your name", "are you real", "bot", "robot", "human"], [
      "I'm Sky 🌤️, a little practice bot built into BlueMob. I'm not a real person, but I chat like one so you can get comfy before your friends join."]],
    [["location", "distance", "far", "radar", "gps"], [
      "The Radar tab shows everyone around you 📡. Turn on \"Share my location\" to see exactly how far apart you are. GPS works without internet!"]],
    [["call", "voice", "video"], ["Voice and video calls are coming soon 📞. They'll go straight over Wi-Fi between nearby phones."]],
    [["safe", "private", "privacy", "secure", "encrypt"], [
      "Privacy matters 🔒. Messages go directly phone to phone. End-to-end encryption is planned, so even phones relaying your message won't be able to read it."]],
    [["thank", "thx", "ty"], ["Anytime! 💚", "You're welcome! Happy exploring 🌍"]],
    [["bye", "see you", "goodbye", "good night", "gn"], ["Bye for now! 👋 I'll be right here whenever you want to chat.", "See you soon, explorer! 🌙"]],

  const SKY_FALLBACK = [
    "Interesting! 🤔 I'm just a simple bot, so I don't know everything. Try asking how BlueMob works.",

  let turn = 0;
  const matches = (text, key) => key.length <= 3

  // Simulated friends answer with their own personality.
  const FRIEND = {

    ravi: { rules: [[["hi", "hello", "hey"], ["Hi! 🐬 Only Bluetooth between us, a bit slower but it works"]],
                    [["where", "location"], ["Up the trail, maybe 400 m from you"]]],
            fallback: ["👍", "Cool cool", "Can you pass a message to Asha? She's out of my range"] },
    meera: { rules: [[["hi", "hello", "hey"], ["Hello! 🌵 I have one bar of internet up here, so I'm bridging messages out for everyone"]],
                     [["internet", "bridge"], ["Yep, my phone carries the group's messages to the internet and back 🌐"]]],
             fallback: ["Got it 🌵", "Haha true", "Let me know if you need to reach anyone outside, I'm your bridge"] },
    dee: { rules: [[["hi", "hello", "hey"], ["Wow, this reached me from the mountains? 😮 2,000 km away and it came through!"]],
                   [["safe", "ok", "fine"], ["So glad you're safe! ❤️ Say hi to everyone there"]]],
           fallback: ["Got it loud and clear from here 🌍", "Amazing that this works with no signal on your side!", "Message received 👍 Take care out there"] },
  };

  // ---------- conversations ----------
  const uid = () => Math.random().toString(36).slice(2, 10);
  function convo(id) {
    if (!S.convos[id]) S.convos[id] = { messages: [], unread: 0, typing: false, queue: [] };
    return S.convos[id];
  }
  convo("sky").messages = SKY_GREETING.map((t) => ({ id: uid(), me: false, text: t, time: now() }));
  convo("sky").unread = 1;

  const later = (ms, fn) => { const t = setTimeout(fn, ms); S.timers.push(t); return t; };

  function incoming(id, text) {
    const c = convo(id);
    c.messages.push({ id: uid(), me: false, text, time: now() });
    if (S.chat !== id) c.unread++;
    refresh();
  }

  function reply(id, text, opts = {}) {
    const c = convo(id);
    later(opts.wait ?? 500, () => {
      c.typing = true; refresh();
      later(Math.min(700 + text.length * 18, 2800), () => {
        c.typing = false;
        incoming(id, text);
      });
    });
  }

  function send(id, text) {
    text = text.trim();
    if (!text) return;
    const c = convo(id);
    const m = { id: uid(), me: true, text, time: now(), status: "sending" };
    c.messages.push(m);
    refresh();

    if (id === "sky") {
      later(350, () => { m.status = "sent"; refresh(); });
      later(800, () => { m.status = "delivered"; refresh(); });
      reply("sky", pickReply(SKY_RULES, SKY_FALLBACK, text), { wait: 1200 });
      return;
    }
    const p = P[id];
    if (p.remote) { sendViaBridge(m); return; }
    if (p.presence !== "online") { m.status = "failed"; refresh(); return; }
    later(150 + p.rtt, () => { m.status = "sent"; refresh(); });
    later(400 + p.rtt * 3, () => { m.status = "delivered"; refresh(); });
    if (Math.random() < 0.85) reply(id, pickReply(FRIEND[id].rules, FRIEND[id].fallback, text), { wait: 1600 });
  }

  // A → B → C (has internet) → internet → D: the gateway idea, played out step by step.
  const bridgeOnline = () => S.mesh && P.meera.presence === "online";
  function routeFor() {
    const hops = ["You"];
    if (P.ravi.presence === "online") hops.push("Ravi");
    hops.push("Meera 🌐", "Internet", "Dee");
    return hops;
  }
  function sendViaBridge(m) {
    if (!bridgeOnline()) {
      m.status = "queued";
      convo("dee").queue.push(m);
      log("No one with internet nearby yet. Message to Dee is waiting.");
      refresh();
      return;
    }
    m.route = routeFor();
    m.hop = 0;
    m.status = "sent";
    refresh();
    const step = () => {
      m.hop++;
      if (m.hop >= m.route.length - 1) {
        m.status = "delivered";
        log("Delivered to Dee via " + m.route.slice(1, -1).join(" → "));
        refresh();
        reply("dee", pickReply(FRIEND.dee.rules, FRIEND.dee.fallback, m.text), { wait: 1800 });
        return;
      }
      refresh();
      later(900, step);
    };
    later(700, step);
  }
  function flushBridgeQueue() {
    const q = convo("dee").queue.splice(0);
    q.forEach((m, i) => later(600 + i * 400, () => sendViaBridge(m)));
  }

  // ---------- mesh simulation ----------
  function log(text) {
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    S.log.unshift(t + "  " + text);
    S.log = S.log.slice(0, 120);
  }
  function setPresence(id, presence) {
    const p = P[id];
    p.presence = presence;
    p.met = true;
    p.lastSeen = now();
    if (presence === "online") {
      log("Connected to " + p.name + " (" + p.link + ")");
      if (id === "meera") { log("Meera has internet: she can bridge messages out"); flushBridgeQueue(); }
    } else if (presence === "range") {
      log("Found " + p.name);
    }
    refresh();
  }
  function startMesh() {
    if (S.mesh) return;
    S.mesh = true;
    log("Mesh on: visible to nearby phones, scanning…");
    later(1200, () => setPresence("asha", "range"));
    later(2300, () => setPresence("asha", "online"));
    later(3000, () => setPresence("ravi", "range"));
    later(4400, () => setPresence("ravi", "online"));
    later(5600, () => setPresence("meera", "range"));
    later(7200, () => setPresence("meera", "online"));
    later(9000, () => { if (S.mesh && convo("asha").messages.length === 0) incoming("asha", "Hey! Saw you pop up on my radar 👋"); });
    refresh();
  }
  function stopMesh() {
    if (!S.mesh) return;
    S.mesh = false;
    S.timers.forEach(clearTimeout);
    S.timers = [];
    for (const p of Object.values(P)) {
      if (p.presence === "online" || p.presence === "range") { p.presence = "offline"; p.lastSeen = now(); }
    }
    for (const c of Object.values(S.convos)) c.typing = false;
    log("Mesh off");
    refresh();
  }

  // People drift a little, so distances feel alive.
  setInterval(() => {
    if (!S.mesh) return;
    for (const id of ["asha", "ravi", "meera"]) {
      const p = P[id];
      if (p.presence !== "online") continue;
      p.dist = Math.max(8, p.dist * (0.97 + Math.random() * 0.06));
      p.bearing = (p.bearing + (Math.random() - 0.5) * 6 + 360) % 360;
    }
    if (S.tab === "radar" && !S.chat && S.onboarded) { placeBlips(); updatePeopleText(); }
  }, 4000);


  // ---------- extra UI state ----------
  Object.assign(S, { screen: "main", query: "", filter: "all", prevTab: S.tab, seen: new Set() });

  // ---------- formatting ----------
  function fmtDist(m) {
    if (m < 10) return "a few m";
    if (m < 1000) return Math.round(m / 5) * 5 + " m";
    if (m < 10000) return (m / 1000).toFixed(1) + " km";
    return Math.round(m / 1000).toLocaleString() + " km";
  }
  function ago(t) {
    const s = Math.max(0, (now() - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return Math.floor(s / 86400) + " d ago";
  }
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const stamp = (t) => (now() - t < 60e3 ? "now" : clock(t));
  const PCOLOR = { online: "var(--online)", range: "var(--away)", offline: "var(--offline)", remote: "var(--sky)" };
  const ORDER = { online: 0, range: 1, offline: 2, remote: 3 };

  function statusLine(p) {
    if (p.remote) return bridgeOnline() ? "2,000 km away · via Meera's internet" : "2,000 km away · waiting for a bridge";
    if (p.presence === "online") return ["Online", S.shareLoc ? fmtDist(p.dist) + " away" : null, p.link].filter(Boolean).join(" · ");
    if (p.presence === "range") return "In range · connecting…";
    return "Seen " + ago(p.lastSeen) + (S.shareLoc ? " · was " + fmtDist(p.dist) + " away" : "");
  }

  // Avatar: emoji on a soft tint. Online people get a ring, others a small status badge.
  function avatar(emoji, seed, size, presence) {
    const ring = presence === "online";

    return `<span class="avatar${ring ? " ring" : ""}" style="width:${size}px;height:${size}px">
      <span class="face" style="background:${tint(seed)};font-size:${Math.round(size * (ring ? .44 : .5))}px">${esc(emoji)}</span>${badge}</span>`;
  }

  // ---------- rendering core ----------
  const app = document.getElementById("app");
  let toastTimer;
  function toast(text) {
    let el = app.querySelector(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); app.appendChild(el); }
    el.textContent = text;
    el.classList.toggle("high", S.screen === "chat");
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function refresh() {
    if (!S.onboarded) return;
    if (S.screen === "chat") { renderChatParts(); return; }
    if (S.screen === "main") render();
  }

  /** anim: "fade" when switching tabs, "push" when opening a screen, none for live updates. */
  function render(anim) {
    const active = document.activeElement;
    const focusId = active && active.id, caret = active && active.selectionStart;
    const keepScroll = !anim ? app.querySelector("#scroll")?.scrollTop ?? 0 : 0;
    const toastEl = app.querySelector(".toast");

    if (!S.onboarded) { app.innerHTML = onboardingView(); afterOnboardingRender(); return; }
    if (S.screen === "chat") { app.innerHTML = chatView(anim); renderChatParts(true); }
    else if (S.screen === "guide") app.innerHTML = guideView(anim);
    else app.innerHTML = mainView(anim);

    if (toastEl) app.appendChild(toastEl);
    const sc = app.querySelector("#scroll");
    if (sc) { sc.scrollTop = keepScroll; syncBar(sc); }
    if (S.screen === "main" && S.tab === "radar") placeBlips();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
    }
    if (S.screen === "main") requestAnimationFrame(() => {
      const ind = app.querySelector(".tab-ind");
      if (ind) ind.style.transform = `translateX(${TABS.findIndex((t) => t.id === S.tab) * 100}%)`;
    });
  }
  function syncBar(sc) {
    const bar = app.querySelector(".bar");
    if (bar && !bar.classList.contains("solid")) bar.classList.toggle("scrolled", sc.scrollTop > 36);
  }
  app.addEventListener("scroll", (e) => { if (e.target.id === "scroll") syncBar(e.target); }, true);

  // ---------- onboarding ----------
  const SLIDES = [
    { art: "offgrid", title: "Talk freely, anywhere", body: "No towers. No internet. BlueMob links phones directly over Bluetooth and Wi-Fi: in the mountains, at sea, or when the network goes down." },
    { art: "hops", title: "Every phone is a path", body: "Messages hop from friend to friend until they reach the right person. The more people around, the further your voice travels." },
    { art: "bridge", title: "One signal frees everyone", body: "If just one person nearby has internet, the whole group can reach the world through them." },
    { art: "radar", title: "See who's around", body: "A live radar shows who's online, how far away they are, and when you last saw them." },
    { art: "buddy", title: "Never alone", body: "Chat with Sky, your built-in buddy, to feel what talking off-grid is like before friends join." },
  ];
  const node = (emoji, x, y, size, seed) =>
    `<span class="node" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;margin:${-size / 2}px;font-size:${size / 2}px;background:${tint(seed)}">${emoji}</span>`;
  function heroArt(kind) {
    if (kind === "offgrid") return `<div class="hero"><span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
      ${node("📱", 50, 50, 92, "me")}<span class="hero-badge">${I.signalOff}</span></div>`;
    if (kind === "hops") return `<div class="hero"><svg viewBox="0 0 300 300" width="100%" height="100%" aria-hidden="true">
      <path id="hopPath" d="M45 210 L150 90 L255 210" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
      <circle r="16" fill="var(--ember)" opacity=".22"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#hopPath"/></animateMotion></circle>
      <circle r="7" fill="var(--ember)"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#hopPath"/></animateMotion></circle></svg>
      ${node("🦅", 15, 70, 64, "a")}${node("🌊", 50, 30, 64, "b")}${node("⛰️", 85, 70, 64, "c")}</div>`;
    if (kind === "bridge") return `<div class="hero"><svg viewBox="0 0 300 300" width="100%" height="100%" aria-hidden="true">
      <path d="M54 234 L135 258 L234 222" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <line x1="234" y1="222" x2="150" y2="60" stroke="var(--pine)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.2s" repeatCount="indefinite"/></line></svg>
      ${node("🌻", 18, 78, 56, "f0")}${node("🍀", 45, 86, 56, "f1")}${node("📶", 78, 74, 56, "f2")}${node("🌍", 50, 20, 88, "earth")}</div>`;
    if (kind === "radar") return `<div class="hero"><div class="night" style="width:100%;height:100%;border-radius:50%"><div class="radar-wrap" data-demo="1"><canvas></canvas></div></div></div>`;
    return `<div class="hero"><div class="bubble-demo"><div class="b me">Hi Sky! 👋</div><div class="b them">Hey! 🌤️ Ready to explore?</div><div class="b me">Let's go! 🚀</div></div></div>`;
  }
  function onboardingView() {
    const last = S.slide === SLIDES.length;
    const s = SLIDES[S.slide];
    const content = last ? `
      <div class="slide">
        <span class="me-badge" id="ob-avatar">${esc(S.avatar)}</span>
        <h1 class="t-title" style="margin-top:8px">Who are you out there?</h1>
        <p>Pick a name and a spirit. People nearby will see these.</p>
        <div class="field" style="width:100%;margin-top:6px"><label class="t-over" for="ob-name">Your name</label>
          <input id="ob-name" maxlength="24" autocomplete="nickname" placeholder="e.g. Arjun" value="${esc(S.name)}"></div>
        <div class="picker" role="group" aria-label="Choose an avatar">${AVATARS.map((a) =>
          `<button data-act="pick-avatar" data-v="${a}" aria-pressed="${a === S.avatar}">${a}</button>`).join("")}</div>
      </div>` : `
      <div class="slide">
        ${heroArt(s.art)}
        ${s.art === "hops" || s.art === "bridge" ? '<span class="tag ember">COMING TO ANDROID · TRY IT IN THIS PREVIEW</span>' : ""}
        <h1 class="t-hero" style="margin-top:6px">${s.title}</h1>
        <p>${s.body}</p>
      </div>`;
    return `<div class="onboard">
      <div class="onboard-top"><span class="wordmark"><i></i>BlueMob</span>
        ${last ? "" : '<button class="btn text" data-act="skip">Skip</button>'}</div>
      ${content}
      <div class="onboard-bottom">
        <div class="dots" aria-hidden="true">${Array.from({ length: SLIDES.length + 1 }, (_, i) => `<span class="${i === S.slide ? "on" : ""}"></span>`).join("")}</div>
        <button class="btn" data-act="${last ? "finish" : "next"}" id="ob-next" ${last && !S.name.trim() ? "disabled" : ""}>
          ${last ? "Start exploring" : "Continue"} ${I.send}</button>
      </div></div>`;
  }
  function afterOnboardingRender() {
    const input = document.getElementById("ob-name");
    if (!input) return;
    input.addEventListener("input", () => {
      S.name = input.value.replace(/\|/g, " ").slice(0, 24);
      document.getElementById("ob-next").disabled = !S.name.trim();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && S.name.trim()) finishOnboarding(); });
  }
  function finishOnboarding() {
    S.name = S.name.trim() || "Explorer";
    S.onboarded = true;
    store.set("name", S.name); store.set("avatar", S.avatar); store.set("onboarded", true);
    S.tab = "radar"; S.screen = "main";
    render("fade");
    later(500, startMesh);
  }

  // ---------- main shell ----------
  const TABS = [
    { id: "radar", label: "Nearby", icon: I.radar },
    { id: "chats", label: "Chats", icon: I.chat },
    { id: "you", label: "You", icon: I.person },
  ];
  function mainView(anim) {
    const title = { radar: "Nearby", chats: "Chats", you: "You" }[S.tab];
    const body = S.tab === "radar" ? radarView() : S.tab === "chats" ? chatsView() : profileView();
    const actions = S.tab === "radar"
      ? `<button class="icon-btn" data-act="tab" data-v="you" aria-label="Your profile">${avatar(S.avatar, "me", 32)}</button>` : "";
    return `<div class="screen ${S.tab === "you" ? "grouped" : ""} ${anim === "fade" ? "fade-in" : anim === "push" ? "push-in" : ""}">
      <header class="bar"><div class="bar-title">${title}</div>${actions}</header>
      <div class="scroll" id="scroll">${body}</div>
      ${tabbar()}</div>`;
  }
  function tabbar() {
    const unread = Object.values(S.convos).reduce((n, c) => n + c.unread, 0);
    const from = TABS.findIndex((t) => t.id === S.prevTab);
    return `<nav class="tabbar" role="tablist"><span class="tab-ind" style="transform:translateX(${from * 100}%)"></span>${TABS.map((t) =>
      `<button class="tab" role="tab" aria-selected="${S.tab === t.id}" data-act="tab" data-v="${t.id}">${t.icon}${t.label}${
        t.id === "chats" && unread ? `<span class="count">${unread}</span>` : ""}</button>`).join("")}</nav>`;
  }

  // ---------- Nearby (radar) ----------
  function greeting() {
    const h = new Date().getHours();
    return h >= 5 && h < 12 ? "Good morning" : h >= 12 && h < 17 ? "Good afternoon" : h >= 17 && h < 22 ? "Good evening" : "Hello, night owl";
  }
  const nearby = () => Object.values(P).filter((p) => !p.remote && p.met);
  function radarView() {
    const list = nearby().sort((a, b) => ORDER[a.presence] - ORDER[b.presence] || b.lastSeen - a.lastSeen);
    const online = list.filter((p) => p.presence === "online").length;
    const range = list.filter((p) => p.presence === "range").length;
    const bridge = bridgeOnline();
    return `
      <div class="large-title"><div class="t-sub">${greeting()}, ${esc(S.name)}</div><h1 class="t-hero">Nearby</h1></div>

      <section class="night">
        <div class="night-top">
          <span class="live ${S.mesh ? "" : "off"}"><span class="pulse"></span>${S.mesh ? "MESH ON" : "MESH OFF"}</span>
          <button class="switch" role="switch" aria-checked="${S.mesh}" aria-label="Mesh" data-act="toggle-mesh"></button>
        </div>
        <div class="radar-wrap" id="radar"><canvas></canvas>${list.map((p) => {
          const { x, y } = blipPos(p);
          return `<button class="blip" data-act="open-chat" data-id="${p.id}" data-blip="${p.id}" aria-label="${esc(p.name)}, ${statusLine(p)}"
            style="left:${x}%;top:${y}%;opacity:${p.presence === "offline" ? .45 : 1};--glow:${p.presence === "online" ? "rgba(95,211,163,.55)" : "transparent"}">
            <span class="face" style="background:${tint(p.id)}">${p.avatar}</span><span class="badge" style="background:${PCOLOR[p.presence]}"></span></button>`;
        }).join("")}</div>
        <div class="night-foot">
          <div class="stat-line num"><div><b>${online}</b><span>online</span></div><div><b>${range}</b><span>in range</span></div><div><b>${list.length}</b><span>met</span></div></div>
          <div class="scale">${S.shareLoc ? "10 m · 300 m · 10 km" : "inner ring = online"}</div>
        </div>
      </section>

      <div class="seg ${S.shareLoc ? "right" : ""}" role="group" aria-label="Radar view" style="margin-top:14px">
        <span class="knob"></span>
        <button data-act="seg" data-v="status" aria-pressed="${!S.shareLoc}">By status</button>
        <button data-act="seg" data-v="distance" aria-pressed="${S.shareLoc}">By distance</button>
      </div>

      <div class="section-h"><h2 class="t-head">Around you</h2><span class="t-cap">${list.length ? list.length + " people" : ""}</span></div>
      ${list.length ? `<div class="hscroll">${list.map(personCard).join("")}</div>`
        : `<div class="card" style="padding:20px;text-align:center"><div style="font-size:34px">🏕️</div>
            <div class="t-strong" style="margin-top:6px">Quiet out here</div>
            <div class="t-sub">Switch the mesh on. People nearby appear as they open BlueMob.</div></div>`}

      <div class="section-h"><h2 class="t-head">Reach further</h2></div>
      <div class="stack" style="gap:10px">
        <button class="card feature press" data-act="open-chat" data-id="dee">
          <span class="tile" style="background:${bridge ? "var(--pine)" : "var(--ember)"}">${bridge ? I.globe : I.cloudOff}</span>
          <span style="flex:1;min-width:0"><span class="t-strong" style="display:block">${bridge ? "Meera is your bridge to the world" : "You're off-grid"}</span>
            <span class="t-sub">${bridge ? "She has internet. Message Dee, 2,000 km away, and watch it travel." : "No internet nearby yet. Messages to faraway friends will wait for a bridge."}</span></span>
          <span class="chev">${I.chevron}</span></button>
        <button class="card feature press" data-act="open-chat" data-id="sky">
          <span class="tile" style="background:var(--sky)">${I.bot}</span>
          <span style="flex:1;min-width:0"><span class="t-strong" style="display:block">Practise with Sky</span>
            <span class="t-sub">A friendly bot that shows how off-grid chats feel.</span></span>
          <span class="chev">${I.chevron}</span></button>
      </div>
      <p class="t-cap" style="text-align:center;margin-top:24px">Web preview · nearby people are simulated. The Android app finds real phones over Bluetooth and Wi-Fi.</p>`;
  }
  function personCard(p) {
    const label = { online: "ONLINE", range: "IN RANGE", offline: "AWAY" }[p.presence];
    const sub = p.presence === "online" ? (S.shareLoc ? fmtDist(p.dist) + " · " : "") + p.link
      : p.presence === "range" ? "Connecting…" : "Seen " + ago(p.lastSeen);
    return `<button class="pcard press" data-act="open-chat" data-id="${p.id}">
      <span class="art" style="background:${tint(p.id)}"><span class="tag"><span class="dot" style="background:${PCOLOR[p.presence]}"></span>${label}</span>${p.avatar}</span>
      <span class="body"><span class="t-strong ellipsis">${esc(p.name)}</span><span class="t-cap ellipsis" data-status-card="${p.id}">${sub}</span></span></button>`;
  }
  function updatePeopleText() {
    document.querySelectorAll("[data-status-card]").forEach((el) => {
      const p = P[el.dataset.statusCard];
      if (p.presence === "online") el.textContent = (S.shareLoc ? fmtDist(p.dist) + " · " : "") + p.link;
    });
  }

  // Placement: with location, real bearing on a log scale (rings at 10 m, ~300 m, 10 km);
  // without, a stable direction and a ring that reflects how reachable they are.
  function blipPos(p) {
    const r = S.shareLoc
      ? Math.min(.9, Math.max(.14, (Math.log10(Math.max(1, p.dist)) + .5) / 4.5))
      : { online: .36, range: .6, offline: .84 }[p.presence];
    const a = (p.bearing * Math.PI) / 180;
    return { x: 50 + 50 * r * Math.sin(a), y: 50 - 50 * r * Math.cos(a) };
  }
  function placeBlips() {
    document.querySelectorAll("[data-blip]").forEach((el) => {
      const p = P[el.dataset.blip];
      const { x, y } = blipPos(p);
      el.style.left = x + "%"; el.style.top = y + "%";
    });
  }

  // The radar is always drawn on a night sky, in both themes.
  const STARS = Array.from({ length: 46 }, () => [Math.random(), Math.random(), Math.random() * 1.2 + .3, Math.random()]);
  let sweep = 0;
  function drawRadars() {
    document.querySelectorAll(".radar-wrap canvas").forEach((cv) => {
      const box = cv.getBoundingClientRect();
      if (!box.width) return;
      const dpr = window.devicePixelRatio || 1;
      const W = Math.round(box.width * dpr);
      if (cv.width !== W) { cv.width = W; cv.height = W; }
      const ctx = cv.getContext("2d");
      const c = W / 2, r = c * .92;
      ctx.clearRect(0, 0, W, W);
      STARS.forEach(([x, y, s, tw]) => {
        ctx.fillStyle = `rgba(234,245,240,${.15 + .35 * Math.abs(Math.sin(sweep / 40 + tw * 6))})`;
        ctx.beginPath(); ctx.arc(x * W, y * W, s * dpr, 0, Math.PI * 2); ctx.fill();
      });
      ctx.strokeStyle = "rgba(234,245,240,.10)"; ctx.lineWidth = dpr;
      for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(c, c, (r * i) / 3, 0, Math.PI * 2); ctx.stroke(); }
      ctx.setLineDash([2 * dpr, 6 * dpr]);
      ctx.beginPath(); ctx.moveTo(c - r, c); ctx.lineTo(c + r, c); ctx.moveTo(c, c - r); ctx.lineTo(c, c + r); ctx.stroke();
      ctx.setLineDash([]);
      const demo = cv.parentElement.dataset.demo;
      if ((S.mesh || demo) && ctx.createConicGradient) {
        const a = (sweep * Math.PI) / 180;
        const g = ctx.createConicGradient(a, c, c);
        g.addColorStop(0, "rgba(95,211,163,.55)"); g.addColorStop(.18, "rgba(95,211,163,0)"); g.addColorStop(1, "rgba(95,211,163,0)");
        ctx.save(); ctx.scale(1, 1);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(95,211,163,.8)"; ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(c + r * Math.cos(a), c + r * Math.sin(a)); ctx.stroke();
        ctx.restore();
      }
      if (demo) {
        [[40, .35, "#3FC897"], [150, .62, "#3FC897"], [250, .84, "#E9A23B"]].forEach(([b, rr, col]) => {
          const ang = (b * Math.PI) / 180, x = c + r * rr * Math.sin(ang), y = c - r * rr * Math.cos(ang);
          ctx.fillStyle = col; ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(x, y, 14 * dpr, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, 7 * dpr, 0, Math.PI * 2); ctx.fill();
        });
      }
      const pulse = .5 + .5 * Math.abs(Math.sin(sweep / 25));
      ctx.fillStyle = "rgba(125,183,234,.28)"; ctx.beginPath(); ctx.arc(c, c, (10 + 12 * pulse) * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7DB7EA"; ctx.beginPath(); ctx.arc(c, c, 6.5 * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * dpr; ctx.stroke();
    });
    if (!reduceMotion) sweep = (sweep + 1.6) % 360;
    requestAnimationFrame(drawRadars);
  }

  // ---------- Chats ----------
  function chatEntries() {

  function introHtml(id, info) {
    const sub = info.bot ? "Practice bot · lives on your phone, works with zero signal"

      : "Met nearby over " + (P[id].link || "Bluetooth") + ". Messages go phone to phone.";

    return `<div class="intro">${avatar(info.emoji, id, 80)}<h2 class="t-title" style="margin-top:8px">${esc(info.name)}</h2>${tag}<p class="t-sub" style="margin-top:4px">${sub}</p></div>`;
  }
  function journeyHtml(m) {
    if (m.status === "queued") return '<div class="journey-note">Waiting for someone nearby with internet…</div>';
    if (!m.route) return "";
    const done = m.status === "delivered";
    const steps = m.route.map((h, i) => `<li class="${done || i < m.hop ? "done" : i === m.hop ? "now" : ""}"><i></i><span class="ellipsis" style="max-width:100%">${esc(h.replace(" 🌐", ""))}</span></li>`).join("");
    const note = done ? "Delivered through Meera's internet" : m.hop === 0 ? "Leaving your phone…" : "Passing through " + m.route[m.hop].replace(" 🌐", "") + "…";
    return `<ol class="journey" aria-label="Route">${steps}</ol><div class="journey-note">${note}</div>`;
  }
  function messagesHtml(id, info, c) {
    const out = [introHtml(id, info), '<span class="tag day">TODAY</span>'];
    const ms = c.messages;
    const same = (a, b) => a && b && a.me === b.me && Math.abs(b.time - a.time) < 120e3 && !a.route && !b.route && a.status !== "queued" && b.status !== "queued";
    ms.forEach((m, i) => {
      const withPrev = same(ms[i - 1], m), withNext = same(m, ms[i + 1]);
      const pos = withPrev && withNext ? "mid" : withNext ? "first" : withPrev ? "last" : "";
      const isNew = !S.seen.has(m.id);
      S.seen.add(m.id);
      const showMeta = !withNext || m.route || m.status === "failed";
      const tick = m.me ? (m.status === "failed" ? '<span class="fail">Not sent · out of range</span>'
        : `<span class="${m.status === "delivered" ? "ok" : ""}" style="display:inline-flex">${TICK[m.status] || ""}</span>`) : "";
      out.push(`<div class="msg ${m.me ? "me" : "them"} ${m.route ? "routed" : ""} ${pos} ${withPrev ? "" : "gap"} ${isNew ? "new" : ""}" data-mid="${m.id}">
        <div class="bubble">${esc(m.text)}</div>${m.me ? journeyHtml(m) : ""}
        ${showMeta ? `<div class="meta">${clock(m.time)}${tick}</div>` : ""}</div>`);
    });
    if (c.typing) out.push('<div class="typing" aria-label="typing"><i></i><i></i><i></i></div>');
    return out.join("");
  }
  function renderChatParts(first) {
    const id = S.chat, info = chatInfo(id), c = convo(id);

          <div class="msg me" style="max-width:100%">${journeyHtml({ status: "sent", route: ["You", "Ravi", "Meera 🌐", "Internet", "Dee"], hop: 2 })}</div>
        </div>
        <p class="t-cap" style="text-align:center;margin-top:24px">The Android app uses the same tokens in Jetpack Compose.</p>
      </div></div>`;
  }

  // ---------- events ----------
  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, v = el.dataset.v;
    switch (act) {
      case "next": S.slide++; render(); break;
      case "skip": S.slide = SLIDES.length; render(); break;
      case "finish": finishOnboarding(); break;
      case "pick-avatar":
        S.avatar = v; store.set("avatar", v);
        if (!S.onboarded) {
          document.getElementById("ob-avatar").textContent = v;
          document.querySelectorAll('[data-act="pick-avatar"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v));
        } else render();
        break;
      case "toggle-mesh": S.mesh ? stopMesh() : startMesh(); break;
      case "seg":
        S.shareLoc = v === "distance"; store.set("shareLoc", S.shareLoc);
        if (S.shareLoc) toast("Sharing your location with people nearby");
        render(); break;
      case "toggle-loc":
        S.shareLoc = !S.shareLoc; store.set("shareLoc", S.shareLoc);
        if (S.shareLoc) toast("Sharing your location with people nearby");
        render(); break;
      case "tab":
        if (S.tab === v) { app.querySelector("#scroll")?.scrollTo({ top: 0, behavior: "smooth" }); break; }
        S.prevTab = S.tab; S.tab = v; store.set("tab", v); render("fade"); S.prevTab = v; break;
      case "filter": S.filter = v; render(); break;
      case "open-chat": S.chat = el.dataset.id; S.screen = "chat"; render("push"); break;
      case "guide": S.screen = "guide"; render("push"); break;
      case "back": S.chat = null; S.screen = "main"; render("fade"); break;
      case "suggest": send("sky", v); break;
      case "soon": toast(v + (v.endsWith("s") ? " are" : " is") + " coming soon"); break;
      case "copy-id":
        try { navigator.clipboard.writeText("3F9A1C2B7D4E8A01").then(() => toast("ID copied"), () => toast("Your ID: 3F9A 1C2B 7D4E 8A01")); }
        catch { toast("Your ID: 3F9A 1C2B 7D4E 8A01"); }
        break;
      case "ping": {
        const p = P[S.chat];
        const rtt = Math.round(p.rtt * (0.8 + Math.random() * 0.5));
        log("Ping " + p.name + ": " + rtt + " ms");
        toast("Link to " + p.name + ": " + rtt + " ms round trip");
        break;
      }
      case "toggle-log": S.showLog = !S.showLog; render(); break;
      case "replay": S.onboarded = false; S.slide = 0; store.set("onboarded", false); render(); break;
      case "forget":
        for (const p of Object.values(P)) if (!p.remote && p.presence === "offline") p.met = false;
        toast("Forgot everyone who isn't nearby");
        render(); break;
    }
  });
  app.addEventListener("submit", (e) => {
    if (e.target.id !== "composer") return;
    e.preventDefault();
    const input = document.getElementById("draft");
    if (!canSend(S.chat)) return;
    if (!input.value.trim()) { toast("Voice notes are coming soon"); return; }
    send(S.chat, input.value);
    input.value = "";
    syncSend();
    input.focus();
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "draft") syncSend();
    if (e.target.id === "q") { S.query = e.target.value; render(); }
    if (e.target.id === "pf-name") {
      const v = e.target.value.replace(/\|/g, " ").slice(0, 24);
      if (v.trim()) { S.name = v.trim(); store.set("name", S.name); app.querySelector(".me-head h1").textContent = S.name; }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.screen !== "main" && S.onboarded) { S.chat = null; S.screen = "main"; render("fade"); }
  });

  // Keep "last seen" times fresh.
  setInterval(() => { if (S.onboarded && S.screen === "main" && S.tab !== "you") refresh(); }, 30000);

  render("fade");
  requestAnimationFrame(drawRadars);
  if (S.onboarded) later(600, startMesh);
})();
</script>
