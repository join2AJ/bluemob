<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>BlueMob admin</title>
<style>
:root{--bg:#f6f3ec;--ink:#1d2a26;--ink2:#56645f;--ink3:#8a9792;--card:#fff;--line:#e3ddd0;--pine:#1f6f5c;--pineT:#dcefe7;--rose:#c2414b;--roseT:#f8e1e3;--ember:#b5651d;--emberT:#f6e6d6;--sky:#2f6fb0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--ink:#e8efe9;--ink2:#b3c1ba;--ink3:#7d8b85;--card:#16201c;--line:#26332e;--pine:#5fd1a8;--pineT:#173b30;--rose:#ef7a83;--roseT:#3b1d21;--ember:#e8a25a;--emberT:#3a2a19;--sky:#7fb3ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header b{font-size:18px;margin-right:auto}nav button{background:none;border:0;color:var(--ink2);font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--pineT);color:var(--pine);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.n{font-size:28px;font-weight:700}.l{color:var(--ink2);font-size:13px}
h2{font-size:16px;margin:24px 0 10px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}.bar{flex:1;display:flex;flex-direction:column-reverse;align-items:stretch;min-width:0}
.bar i{display:block;border-radius:4px 4px 0 0}.bar span{font-size:10px;color:var(--ink3);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:90px}input[type=text],input[type=password],input[type=url]{width:100%}
button.btn{font:inherit;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--pine);color:var(--bg);font-weight:600}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink)}button.danger{background:none;border:1px solid var(--rose);color:var(--rose)}
.rep{cursor:pointer}.rep+.rep{margin-top:10px}.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-right:6px}
.t-open{background:var(--emberT);color:var(--ember)}.t-in{background:var(--pineT);color:var(--sky)}.t-res{background:var(--pineT);color:var(--pine)}.t-auto{background:var(--roseT);color:var(--rose)}
.meta{color:var(--ink3);font-size:12px}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:10px;font-size:12px;max-height:320px;overflow:auto}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.photos img{width:120px;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--ink2)}
#login{max-width:420px;margin:12vh auto;padding:0 16px}.hidden{display:none}.err{color:var(--rose)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
</style></head><body>
<div id="login" class="card">
  <h1 style="font-size:22px;margin:0 0 6px">BlueMob admin</h1>
  <p class="muted">Enter the admin token (ADMIN_TOKEN on the server). It stays in this browser tab only.</p>
  <input id="tok" type="password" placeholder="Admin token" autocomplete="off">
  <p id="loginErr" class="err"></p>
  <button class="btn" id="go">Open</button>
</div>
<div id="app" class="hidden">
<header><b>BlueMob admin</b>
  <nav><button data-tab="overview" class="on">Overview</button><button data-tab="reports">Reports</button><button data-tab="news">News</button></nav>
  <button class="ghost btn" id="out">Sign out</button>
</header>
<main>
  <section id="overview"></section>
  <section id="reports" class="hidden">
    <div class="filters">
      <select id="fCat"><option value="">All topics</option></select>
      <select id="fStatus"><option value="">Any status</option><option>open</option><option>in progress</option><option>resolved</option></select>
      <select id="fKind"><option value="">User and automatic</option><option value="user">From users</option><option value="auto">Automatic errors</option></select>
      <input id="fText" type="text" placeholder="Search text" style="max-width:240px">
    </div>
    <div id="cats" class="cats"></div>
    <h2 id="repCount"></h2>
    <div id="repList"></div>
  </section>
  <section id="news" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Send news to every phone</h2>
      <p class="muted">Phones signed in get it within seconds; others when they next connect. Urgent news sounds even during do not disturb.</p>
      <input id="nTitle" type="text" placeholder="Title (e.g. Heavy rain warning)" maxlength="80">
      <p></p><textarea id="nText" placeholder="Message" maxlength="1000"></textarea>
      <p></p><input id="nLink" type="url" placeholder="Link (optional, https://…)">
      <p class="row"><label><input id="nUrgent" type="checkbox"> Urgent</label></p>
      <button class="btn" id="nSend">Send to everyone</button> <span id="nMsg" class="muted"></span>
    </div>
    <h2>Sent</h2><div id="newsList"></div>
  </section>
</main></div>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("bm-admin") || "";
let reports = [], counts = {};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => new Date(t).toLocaleString();
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "x-admin-token": token, "content-type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401 || r.status === 403) throw new Error("token");
  return r.json();
}
async function start() {
  try { await loadOverview(); $("login").classList.add("hidden"); $("app").classList.remove("hidden"); loadReports(); loadNews(); }
  catch (e) { $("loginErr").textContent = e.message === "token" ? "That token isn't right." : "Couldn't reach the server."; sessionStorage.removeItem("bm-admin"); }
}
$("go").onclick = () => { token = $("tok").value.trim(); sessionStorage.setItem("bm-admin", token); start(); };
$("tok").onkeydown = (e) => { if (e.key === "Enter") $("go").click(); };
$("out").onclick = () => { sessionStorage.removeItem("bm-admin"); location.reload(); };
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  ["overview", "reports", "news"].forEach((t) => $(t).classList.toggle("hidden", t !== b.dataset.tab));
});

async function loadOverview() {
  const s = await api("/v1/admin/stats");
  const days = Object.entries(s.perDay);
  const max = Math.max(1, ...days.map(([, d]) => d.user + d.auto));
  const tiles = [["Devices", s.devices, "BlueMob IDs the server knows"], ["Online now", s.onlineNow, "signed in to the live link"],
    ["Verified numbers", s.verifiedNumbers, "fingerprints only"], ["Messages waiting", s.waitingMessages, "for phones offline"],
    ["Push ready", s.pushReady, "can be woken by Firebase"], ["Open reports", s.openReports, `of ${s.reports} in total`]];
  $("overview").innerHTML = `<div class="grid">${tiles.map(([l, n, h]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div><div class="meta">${h}</div></div>`).join("")}</div>
    <h2>Reports, last 14 days</h2><div class="card"><div class="bars">${days.map(([d, v]) => `<div class="bar" title="${d}: ${v.user} from users, ${v.auto} automatic">
      <span>${d.slice(5)}</span><i style="height:${v.user / max * 110}px;background:var(--pine)"></i><i style="height:${v.auto / max * 110}px;background:var(--rose)"></i></div>`).join("")}</div>
      <div class="legend"><span><span class="dot" style="background:var(--pine)"></span>From users</span><span><span class="dot" style="background:var(--rose)"></span>Automatic errors</span></div></div>
    <p class="meta">Server up since ${when(s.upSince)} · ${s.news} news items sent</p>`;
}

async function loadReports() {
  const r = await api("/v1/reports");
  reports = r.reports; counts = r.counts;
  const cats = Object.keys(counts).sort();
  $("fCat").innerHTML = `<option value="">All topics</option>` + cats.map((c) => `<option>${esc(c)}</option>`).join("");
  renderReports();
}
["fCat", "fStatus", "fKind"].forEach((id) => $(id).onchange = renderReports);
$("fText").oninput = renderReports;
function renderReports() {
  const cat = $("fCat").value, st = $("fStatus").value, kind = $("fKind").value, q = $("fText").value.toLowerCase();
  const shown = reports.filter((r) => (!cat || (r.category || "Other") === cat) && (!st || (r.status || "open") === st) &&
    (!kind || (kind === "auto") === !!r.auto) && (!q || (r.text + " " + (r.details || "")).toLowerCase().includes(q)));
  // Where the problems are: each topic with its sub-topics, most reported first.
  $("cats").innerHTML = Object.entries(counts).sort((a, b) => sum(b[1]) - sum(a[1])).map(([c, subs]) => `<div class="card"><b>${esc(c)}</b> <span class="muted">${sum(subs)}</span>
    <div class="meta">${Object.entries(subs).sort((a, b) => b[1] - a[1]).map(([s, n]) => `${esc(s)} ${n}`).join(" · ")}</div></div>`).join("");
  $("repCount").textContent = `${shown.length} report${shown.length === 1 ? "" : "s"}`;
  $("repList").innerHTML = shown.map((r) => {
    const status = r.status || "open";
    const cls = status === "resolved" ? "t-res" : status === "in progress" ? "t-in" : "t-open";
    return `<div class="card rep" data-id="${esc(r.id)}">
      <div><span class="tag ${cls}">${esc(status.toUpperCase())}</span>${r.auto ? '<span class="tag t-auto">AUTOMATIC</span>' : ""}<b>${esc(r.category || "Other")}</b> · ${esc(r.sub || "Other")}</div>
      <div>${esc(r.text.slice(0, 220))}</div><div class="meta">${when(r.at)} · ${esc(r.app || "")}${r.photos ? ` · ${r.photos} photo${r.photos > 1 ? "s" : ""}` : ""}</div>
      <div class="more hidden"></div></div>`;
  }).join("");
  document.querySelectorAll(".rep").forEach((el) => el.onclick = (e) => { if (!e.target.closest(".more")) toggle(el); });
}
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
async function toggle(el) {
  const more = el.querySelector(".more");
  if (!more.classList.contains("hidden")) { more.classList.add("hidden"); return; }
  const r = reports.find((x) => x.id === el.dataset.id);
  const photos = [];
  for (let i = 0; i < (r.photos || 0); i++) {
    const res = await fetch(`/v1/reports/${encodeURIComponent(r.id)}/${i}`, { headers: { "x-admin-token": token } });
    if (res.ok) photos.push(URL.createObjectURL(await res.blob()));
  }
  more.innerHTML = `<p>${esc(r.text)}</p>${photos.length ? `<div class="photos">${photos.map((u) => `<a href="${u}" target="_blank"><img src="${u}" alt="photo"></a>`).join("")}</div>` : ""}
    ${r.device ? `<div class="meta">${esc(r.device)}</div>` : ""}${r.details ? `<pre>${esc(r.details)}</pre>` : ""}
    <textarea placeholder="Note for the team (what was done)">${esc(r.note || "")}</textarea>
    <p class="row">${["open", "in progress", "resolved"].map((s) => `<button class="btn ${s === (r.status || "open") ? "" : "ghost"}" data-s="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join("")}</p>`;
  more.classList.remove("hidden");
  more.querySelectorAll("button[data-s]").forEach((b) => b.onclick = async () => {
    await api("/v1/reports/status", { method: "POST", body: JSON.stringify({ token, id: r.id, status: b.dataset.s, note: more.querySelector("textarea").value }) });
    r.status = b.dataset.s; r.note = more.querySelector("textarea").value; renderReports(); loadOverview();
  });
}

async function loadNews() {
  const r = await (await fetch("/v1/announcements?since=0")).json();
  $("newsList").innerHTML = r.items.length ? r.items.map((n) => `<div class="card rep"><div>${n.urgent ? '<span class="tag t-auto">URGENT</span>' : ""}<b>${esc(n.title)}</b></div>
    <div>${esc(n.text)}</div>${n.link ? `<div class="meta">${esc(n.link)}</div>` : ""}<div class="meta">${when(n.at)}</div>
    <p><button class="danger btn" data-id="${esc(n.id)}">Remove</button></p></div>`).join("") : `<p class="muted">Nothing sent yet.</p>`;
  $("newsList").querySelectorAll("button[data-id]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this news item? Phones that already have it keep it.")) return;
    await api("/v1/announce", { method: "POST", body: JSON.stringify({ token, remove: b.dataset.id }) }); loadNews();
  });
}
$("nSend").onclick = async () => {
  const title = $("nTitle").value.trim(), text = $("nText").value.trim();
  if (!title || !text) { $("nMsg").textContent = "Add a title and a message."; return; }
  if (!confirm(`Send "${title}" to every BlueMob phone?`)) return;
  const r = await api("/v1/announce", { method: "POST", body: JSON.stringify({ token, title, text, link: $("nLink").value.trim(), urgent: $("nUrgent").checked }) });
  $("nMsg").textContent = r.ok ? "Sent." : "Couldn't send it."; if (r.ok) { $("nTitle").value = $("nText").value = $("nLink").value = ""; $("nUrgent").checked = false; loadNews(); loadOverview(); }
};
if (token) start();
</script></body></html>
